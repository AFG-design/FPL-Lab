name: Refresh FPL data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the optimiser
        run: pip install -r requirements.txt
      - name: Build data.json from the FPL API
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID || '8122679' }}
        run: python3 build.py "$FPL_TEAM_ID" site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
