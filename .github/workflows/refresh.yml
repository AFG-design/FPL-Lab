name: Refresh FPL data

on:
  schedule:
    - cron: "7 * * * *"      # hourly (UTC), FL-111; an external scheduler can also start it (see README)
    - cron: "*/10 * * * *"   # every 10 minutes: rebuilds during matches, and every 30 minutes before a deadline (see "check")
  workflow_dispatch:          # "Run workflow" button, the dashboard's Refresh button, or an external scheduler
    inputs:
      live_only:
        description: "Only rebuild while a match is on (or every 30 minutes before a deadline, or on the hour). For an external scheduler every 10 minutes."
        required: false
        default: "false"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serialise the full refresh, including the Pages deployment.
  group: pages
  cancel-in-progress: false

jobs:
  # The 10-minute schedule (and an external scheduler sending live_only=true) rebuilds every 10 minutes while a match
  # is on, every 30 minutes in the 6 hours before a deadline, and otherwise once an hour (FL-111). The rule and what
  # happens when FPL can't be reached are in scripts/refresh_due.py. Everything else always runs.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/refresh_due.py
          sparse-checkout-cone-mode: false
      - id: c
        env:
          SCHED: ${{ github.event.schedule }}
          LIVE_ONLY: ${{ github.event.inputs.live_only }}
        run: |
          if [ "$SCHED" != "*/10 * * * *" ] && [ "$LIVE_ONLY" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/refresh_due.py >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the optimiser
        run: pip install -r requirements.txt
      - name: Build, validate and push refresh data
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID || '8122679' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "fpl-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 scripts/refresh.py
      - name: Keep sampled data for recovery if the refresh fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-refresh-${{ github.run_attempt }}
          path: |
            history/
            crowd/
            understat/
            odds/
            ${{ runner.temp }}/refresh-attempt-*.tar.gz
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
