name: Refresh FPL data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC); an external scheduler can also start it (see README)
    - cron: "*/10 * * * *"   # every 10 minutes, but only goes ahead while a Premier League match is on (see "check")
  workflow_dispatch:          # "Run workflow" button, the dashboard's Refresh button, or an external scheduler
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The 10-minute schedule is for live gameweeks: skip unless a match kicked off in the last 2.5 hours
  # (or kicks off in the next 10 minutes). Everything else always runs.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$SCHED" != "*/10 * * * *" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request, datetime as dt
          try:
              req = urllib.request.Request("https://fantasy.premierleague.com/api/fixtures/", headers={"User-Agent": "Mozilla/5.0 fpl-lab"})
              fx = json.load(urllib.request.urlopen(req, timeout=20))
          except Exception:
              fx = []
          now = dt.datetime.now(dt.timezone.utc)
          live = any(f.get("kickoff_time") and -dt.timedelta(minutes=10) <= now - dt.datetime.fromisoformat(f["kickoff_time"].replace("Z", "+00:00")) <= dt.timedelta(hours=2.5) for f in fx)
          print("run=" + ("true" if live else "false"))
          PY

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the optimiser
        run: pip install -r requirements.txt
      - name: Sample other managers' teams (only does work once per gameweek)
        continue-on-error: true
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID || '8122679' }}
        run: python3 crowd.py "$FPL_TEAM_ID"
      - name: Update shots data from Understat (only new matches)
        continue-on-error: true
        run: python3 understat.py
      - name: Update betting-market odds (football-data.co.uk)
        continue-on-error: true
        run: python3 odds.py
      - name: Update player odds (The Odds API; only at 72 h, 24 h and 3 h before each deadline)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 odds_players.py
      - name: Build data.json from the FPL API
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID || '8122679' }}
        run: python3 build.py "$FPL_TEAM_ID" site/data.json
      - name: Save sampled data to the repository
        continue-on-error: true
        run: |
          git config user.name "fpl-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crowd/ understat/ odds/ history/
          if ! git diff --cached --quiet; then
            git commit -m "Data update" && git pull --rebase && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
