name: Update last-season priors

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  priors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 make_priors.py priors.json
      - name: Rebuild the AFG records (venue, opponent and home/away history since 2019/20)
        run: python3 afg.py records
      - name: Commit if changed
        run: |
          git config user.name "fpl-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add priors.json afg/records.json
          git diff --cached --quiet || git commit -m "Update last-season priors and AFG records"
          python3 scripts/push_data.py
      - name: Keep generated data if publishing fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-priors-${{ github.run_attempt }}
          path: |
            priors.json
            afg/records.json
