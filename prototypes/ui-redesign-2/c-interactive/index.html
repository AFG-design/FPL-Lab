<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FPL LAB · C Modern &amp; Interactive (prototype)</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="FPL LAB">
    <div class="brand"><span class="mark" aria-hidden="true"></span>FPL LAB</div>
    <a class="dcard" href="#home" id="dcard"></a>
    <button class="cmd" type="button" data-palette>Search or jump to… <kbd>/</kbd></button>
    <nav id="sidenav" aria-label="Sections"></nav>
  </aside>
  <div class="main">
    <div class="sample" id="sample"></div>
    <header class="top" id="top"></header>
    <main id="app" tabindex="-1"></main>
  </div>
</div>
<nav class="dock" id="dock" aria-label="Sections"></nav>
<div class="tray" id="tray" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden></div>
<script src="../shared/sample-data.js"></script>
<script src="../shared/proto.js"></script>
<script src="app.js"></script>
</body>
</html>
