<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FPL LAB · A Refined (prototype)</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="FPL LAB">
    <div class="wordmark"><span class="wm-mark" aria-hidden="true"></span>FPL LAB</div>
    <div class="side-team" id="sideTeam"></div>
    <nav id="sidenav" aria-label="Sections"></nav>
    <div class="side-foot"><button class="ghost" type="button" data-theme-toggle></button></div>
  </aside>
  <div class="maincol">
    <div class="sample" id="sample"></div>
    <header class="topbar" id="topbar"></header>
    <div class="statstrip mobile-only" id="statstrip"></div>
    <main id="app" tabindex="-1"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Sections"></nav>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></aside>
<script src="../shared/sample-data.js"></script>
<script src="../shared/proto.js"></script>
<script src="app.js"></script>
</body>
</html>
