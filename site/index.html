<meta name="robots" content="noindex">
<title>FPL LAB</title>
<script>
  // Set the saved theme before anything paints, so there's no flash of the wrong colours.
  try { const t = localStorage.getItem("fpl.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>

<body>
<a class="skip" href="#app">Skip to content</a>
<div class="shell">
  <aside class="sidebar" aria-label="FPL LAB">
    <div class="wordmark" aria-hidden="true"><span class="wm-mark"></span>FPL LAB</div>
    <nav id="sidenav" aria-label="Sections"></nav>
    <div class="side-foot">
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"></button>
    </div>
  </aside>

  <div class="maincol">
    <header class="topbar">
      <div class="team">
        <span class="wordmark mobile-only" aria-hidden="true"><span class="wm-mark"></span>FPL LAB</span>
        <h1 id="teamName">Your team</h1>
        <span class="sub" id="mgr">Loading your squad</span>
      </div>
      <button class="searchbtn" type="button" data-search aria-label="Search players, clubs and sections" aria-keyshortcuts="/"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><span>Search</span><kbd>/</kbd></button>
      <dl class="score" id="score"></dl>
      <button class="theme-toggle icon-only mobile-only" type="button" data-theme-toggle aria-pressed="false"></button>
    </header>
    <div class="status" id="meta" aria-live="polite"></div>
    <main id="app" tabindex="-1"></main>
    <footer>FPL LAB uses the public Fantasy Premier League API. Projections are estimates, not guarantees.</footer>
  </div>
</div>

<nav class="bottomnav" id="bottomnav" aria-label="Sections"></nav>
<div class="sheet" id="moreSheet" hidden><div class="sheetbody" role="menu" aria-label="More sections"></div></div>
