<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BACK2BACK FPL Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FPL Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: matchday programme — sticky scoreboard header, tabbed sections, a chalk-lined pitch as the hero of "My team" */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dccf; --fg:#17201a; --muted:#5c695f;
  --turf:#1f6b45; --turf-2:#2a8558; --chalk:rgba(255,255,255,.55); --armband:#d99a1c; --armband-fg:#2a1d00;
  --good:#1d8a52; --warn:#c07a0c; --bad:#c23a32; --info:#2f6fb5;
  --d1:#1d8a52; --d2:#67b37d; --d3:#c9cfc3; --d4:#e48b6b; --d5:#c23a32; --d-fg-dark:#0e1510; --d-fg-light:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1410; --surface:#141d17; --sunk:#1b261f; --line:#2a372f; --fg:#e6ede7; --muted:#93a198;
  --turf:#17402b; --turf-2:#1d5236; --chalk:rgba(255,255,255,.28); --armband:#f0b23a; --armband-fg:#241800;
  --good:#3fbf7a; --warn:#e8a33a; --bad:#ef6a5f; --info:#6ea6e6;
  --d1:#2f9e62; --d2:#5d9c70; --d3:#46524a; --d4:#b76a50; --d5:#b5372f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1410; --surface:#141d17; --sunk:#1b261f; --line:#2a372f; --fg:#e6ede7; --muted:#93a198;
  --turf:#17402b; --turf-2:#1d5236; --chalk:rgba(255,255,255,.28); --armband:#f0b23a; --armband-fg:#241800;
  --good:#3fbf7a; --warn:#e8a33a; --bad:#ef6a5f; --info:#6ea6e6;
  --d1:#2f9e62; --d2:#5d9c70; --d3:#46524a; --d4:#b76a50; --d5:#b5372f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.lbl{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--armband);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px 8px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:28px;font-weight:800;line-height:1}
.brand .sub{font-size:13px;color:var(--muted)}
.score{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.score div{display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.deadline b{color:var(--armband)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--turf-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);padding-block:6px 0}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--turf-2)}
.btn.primary{background:var(--turf-2);border-color:var(--turf-2);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}

main{padding-block:20px 60px}
@media (max-width:600px){header{position:static}.brand h1{font-size:24px}.score{gap:12px;margin-left:0}.score b{font-size:18px}}
section.view{display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}

/* pitch */
.pitchwrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pitch{grid-template-columns:minmax(0,1fr);position:relative;background:repeating-linear-gradient(180deg,var(--turf) 0 56px,var(--turf-2) 56px 112px);padding:18px 8px 14px;display:grid;gap:14px}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid var(--chalk);border-radius:4px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:8px;width:150px;height:60px;transform:translateX(-50%);border:2px solid var(--chalk);border-top:0;pointer-events:none}
.row{min-width:0;position:relative;display:flex;justify-content:center;gap:6px;z-index:1;flex-wrap:nowrap}
.bench{background:var(--sunk);padding:12px 8px;display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
.bench .lbl{align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px}
.pc{position:relative;width:96px;flex:0 1 96px;min-width:0;background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 5px 5px;text-align:center;border:0;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.pc .tm{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.pc .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .xp{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.pc .fx{display:flex;gap:2px;justify-content:center;margin-top:3px}
.pc .fx span{flex:1;min-width:0;font-size:9.5px;font-weight:600;border-radius:3px;padding:1px 0;font-family:var(--display);letter-spacing:.02em}
.badge{position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--armband);color:var(--armband-fg);font-family:var(--display);font-weight:800;font-size:13px;line-height:20px}
.badge.v{background:var(--fg);color:var(--surface)}
.flag{position:absolute;top:-6px;left:-4px;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:700;line-height:18px;padding:0 4px;color:#fff}
.flag.d{background:var(--warn)} .flag.i,.flag.s,.flag.u,.flag.n{background:var(--bad)}
@media (max-width:520px){.pc{flex-basis:70px;padding:5px 3px 4px}.pc .nm{font-size:11.5px}.pc .xp{font-size:16px}.pc .fx span{font-size:8.5px}.row,.bench{gap:4px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* difficulty chips */
.d1{background:var(--d1);color:var(--d-fg-light)} .d2{background:var(--d2);color:var(--d-fg-dark)} .d3{background:var(--d3);color:var(--fg)} .d4{background:var(--d4);color:var(--d-fg-dark)} .d5{background:var(--d5);color:var(--d-fg-light)}

/* lists */
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:14px}
.alerts li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--info)}
.alerts li.bad::before{background:var(--bad)} .alerts li.warn::before{background:var(--warn)} .alerts li.good::before{background:var(--good)}

.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx .step{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted);width:28px}
.tx .mv{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.tx .mv .out{color:var(--bad)} .tx .mv .in{color:var(--good)}
.tx .why{grid-column:2/4;font-size:13px;color:var(--muted)}
.tx .gain{text-align:right;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mut{color:var(--muted)}
.verdict{border-left:4px solid var(--turf-2);background:var(--sunk);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:15px}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort[aria-sort]{color:var(--fg)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--armband)}
.pname{font-weight:600}
.tick td.fxc{padding:3px}
.fxc span{display:block;text-align:center;border-radius:4px;padding:4px 2px;font-family:var(--display);font-weight:600;font-size:13px;min-width:58px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px}
.filters input[type=search]{flex:1 1 180px;min-width:0}

.capbars{display:grid;gap:10px}
.cb{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 48px;gap:10px;align-items:center}
.cb .track{height:22px;background:var(--sunk);border-radius:4px;overflow:hidden}
.cb .fill{height:100%;background:var(--turf-2);border-radius:4px}
.cb.top .fill{background:var(--armband)}
.cb .val{font-family:var(--display);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.cb .why{grid-column:1/4;font-size:12.5px;color:var(--muted);margin-top:-6px}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.chip{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.chip h3{font-size:18px}
.chip.used{opacity:.6}

.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cmp{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cmp dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 0;font-size:13px}
.cmp dt{color:var(--muted)} .cmp dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmp dd.best{color:var(--good)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;display:grid;gap:14px;overflow:auto}
.dlg .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;color:var(--muted)}
.brk{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.brk div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.brk b{display:block;font-family:var(--display);font-size:18px}
.gwbars{display:flex;gap:6px;align-items:flex-end;height:90px}
.gwbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);justify-content:flex-end;height:100%}
.gwbars i{display:block;width:100%;background:var(--turf-2);border-radius:3px 3px 0 0}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart text{font-size:14px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---- v2 additions ---- */
.steps{display:grid;gap:14px}
.stepcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stepcard .sbody{display:grid;gap:6px;min-width:0}
.stepcard .no{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;background:var(--sunk);color:var(--muted)}
.stepcard.act .no{background:var(--armband);color:var(--armband-fg)}
.stepcard.ok .no{background:var(--good);color:#fff}
.stepcard h3{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stepcard .do{font-size:16px;font-weight:600}
.stepcard .sub{font-size:13.5px;color:var(--muted)}
.moves{display:grid;gap:6px;margin:6px 0 2px}
.move{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.move .out{color:var(--bad)} .move .in{color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left}
.opt b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--armband);box-shadow:inset 0 0 0 1px var(--armband)}
.opt span{font-size:12px;color:var(--muted)}
.gwsel{display:flex;gap:6px;flex-wrap:wrap}
.gwsel button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:15px;min-width:64px;text-align:left}
.gwsel button small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.gwsel button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.gwsel button[aria-pressed="true"] small{color:var(--surface);opacity:.8}
.pc.sel{outline:3px solid var(--armband);outline-offset:1px}
.pc.newin{box-shadow:inset 0 -3px 0 var(--good)}
.plansum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.cand:hover{background:var(--sunk)}
.cand .d{font-size:12px;color:var(--muted);grid-column:1/4}
.cand b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.s1{stroke:var(--turf-2);background:var(--turf-2)} .s2{stroke:var(--armband);background:var(--armband)} .s3{stroke:var(--info);background:var(--info)} .s4{stroke:var(--bad);background:var(--bad)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.minibar{display:inline-block;height:8px;border-radius:4px;background:var(--turf-2);vertical-align:middle}
.minibar.neg{background:var(--bad)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
footer{padding-block:0 40px;font-size:12.5px;color:var(--muted)}
.pc .shirt{display:block;width:30px;height:30px;margin:-2px auto 0;object-fit:contain}
@media (max-width:520px){.pc .shirt{width:24px;height:24px}}
details{margin-top:4px} details summary{font-size:13.5px;color:var(--muted);font-weight:600;list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";} details[open] summary::before{content:"▾ ";}
.dbody{display:grid;gap:8px;margin-top:8px}
.stepcard h3 .pill{font-family:var(--body);font-size:11px}
.eudot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:4px;vertical-align:middle;opacity:.8}
.term{all:unset;cursor:help;border-bottom:1px dotted currentColor;text-underline-offset:2px}
.term:focus-visible{outline:2px solid var(--armband);outline-offset:2px}
#tip{position:fixed;z-index:50;background:var(--fg);color:var(--surface);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13.5px;line-height:1.45}
#tip b{display:block;margin-bottom:4px} #tip p{margin:0}
.pillwrap{display:inline-flex}
.ptabs{justify-self:start;max-width:100%;overflow-x:auto}
.ptabs button{white-space:nowrap}
.sugg{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.sugg:first-of-type{border-top:0}
.sg-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sg-gain{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.sg-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sgfx{display:inline-flex;gap:2px}
.sgfx span{font-family:var(--display);font-weight:600;font-size:11px;border-radius:3px;padding:1px 6px}
.sg-why{font-size:13px;color:var(--muted)}
.sg-add{justify-self:start}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.rules > div{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;max-width:100%}
.phead{display:flex;gap:14px;align-items:flex-start}
.photo{width:72px;height:92px;object-fit:cover;border-radius:8px;background:var(--sunk);flex:none}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand"><h1 id="teamName">FPL Lab</h1><span class="sub" id="mgr">Loading your squad…</span></div>
      <div class="score" id="score"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="week">This week</button>
      <button role="tab" data-v="planner">Planner</button>
      <button role="tab" data-v="rivals">Rivals</button>
      <button role="tab" data-v="fixtures">Fixtures</button>
      <button role="tab" data-v="players">Players</button>
      <button role="tab" data-v="stats">Stats</button>
      <button role="tab" data-v="chips">Chips</button>
      <button role="tab" data-v="review">Review</button>
      <button role="tab" data-v="model">Model</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="meta" id="meta"></div>
  <div id="app" style="margin-top:14px"><p class="empty">Loading the latest FPL data…</p></div>
</main>
<footer class="wrap">FPL Lab uses the public Fantasy Premier League API. Projections are estimates, not guarantees.</footer>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
const REPO = "AFG-design/FPL-Lab";
const S = { view: "week", plan: null, fxMode: "att", sort: "xp5", dir: -1, pos: "ALL", team: "ALL", maxp: "", q: "", cmp: [],
  stSort: "xgi90_4", stPos: "ATT", trendTeam: null, pitch: "plan" };
let D, P, T, GWS, PG, MINE, SB;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = x => (Math.round((x || 0) * 10) / 10).toFixed(1);
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + f1(Math.abs(x));
const money = x => "£" + Number(x).toFixed(1) + "m";
const rankFmt = n => n == null ? "–" : n.toLocaleString("en-GB");
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const VIEWS = ["week", "planner", "rivals", "review", "fixtures", "players", "stats", "chips", "model"];
{ const v = store.get("fpl.view"); if (VIEWS.includes(v)) S.view = v; }
S.mode = ["balanced", "safe", "chase"].includes(store.get("fpl.mode")) ? store.get("fpl.mode") : "balanced";
S.ptab = ["suggest", "plans", "rules", "drafts"].includes(store.get("fpl.ptab")) ? store.get("fpl.ptab") : "suggest";
S.stab = ["form", "shots", "sp", "defence", "bonus", "value", "teams"].includes(store.get("fpl.stab")) ? store.get("fpl.stab") : "form";
S.horizon = [3, 5, 6].includes(store.get("fpl.horizon")) ? store.get("fpl.horizon") : 5;
function setHorizon(h) {
  S.horizon = h; store.set("fpl.horizon", h);
  PG = GWS.slice(0, Math.min(h, GWS.length)); _base = null; _sugg = { key: "", list: [] }; _pairs = { key: "", list: [] };
  if (!PG.includes(SB.gw)) SB.gw = PG[0];
}
if (location.hash && VIEWS.includes(location.hash.slice(1))) S.view = location.hash.slice(1);

/* ---------- helpers ---------- */
function attClass(x) { return x >= 1.9 ? "d1" : x >= 1.5 ? "d2" : x >= 1.15 ? "d3" : x >= 0.85 ? "d4" : "d5"; }
function defClass(x) { return x <= 0.85 ? "d1" : x <= 1.1 ? "d2" : x <= 1.4 ? "d3" : x <= 1.75 ? "d4" : "d5"; }
const fxFor = (tid, g) => T[tid].fx[g] || [];
const oppTxt = x => x.home ? T[x.opp].short : T[x.opp].short.toLowerCase();
function fxChips(p, from, n = 3) {
  const gs = GWS.filter(g => g >= from).slice(0, n);
  return gs.map(g => {
    const fx = fxFor(p.team, g);
    if (!fx.length) return `<span class="d5">—</span>`;
    return fx.map(x => `<span class="${(p.pos === "GKP" || p.pos === "DEF") ? defClass(x.xga) : attClass(x.xgf)}" title="GW${g}: ${T[x.opp].name} ${x.home ? "home" : "away"}">${oppTxt(x)}</span>`).join("");
  }).join("");
}
const fxText = (p, g) => fxFor(p.team, g).map(x => `${T[x.opp].short} (${x.home ? "H" : "A"})`).join(" + ") || "Blank";
function flag(p) {
  if (p.status === "a") return "";
  return `<span class="flag ${p.status}" title="${esc(p.news)}">${p.chance != null ? p.chance + "%" : "!"}</span>`;
}
const xpg = (id, g) => (P[id]?.xp[g]) || 0;
const xpFrom = (id, g, n = 99) => GWS.filter(x => x >= g).slice(0, n).reduce((a, x) => a + xpg(id, x), 0);

// strategy-aware values (same maths as the optimiser): Safe leans to what the field owns, Chase away from it
const LAM = { balanced: 0, safe: 0.02, chase: -0.03 };
function fieldEO() { const F = D.crowd ? (D.crowd.near?.n >= 100 ? D.crowd.near : D.crowd.top10k) : null; return F ? F.eo : null; }
function adjXI(i, g) {
  const lam = LAM[S.mode] || 0, eo = fieldEO(), x = xpg(i, g);
  if (!lam || !eo || PG.indexOf(g) > 1) return x;
  const k = 1 - 2 * (eo[i] || 0) / 100;
  // Chase only rewards differentials; it never pushes you to drop players the field owns
  return x - lam * variance(P[i].pos, x) * (lam < 0 ? Math.max(0, k) : k);
}
function adjCap(i, g) {  // value of the captain's extra multiplier
  const lam = LAM[S.mode] || 0, eo = fieldEO(), x = xpg(i, g);
  if (!lam || !eo || PG.indexOf(g) > 1) return x;
  const k = 3 - 2 * (eo[i] || 0) / 100;
  return x - lam * variance(P[i].pos, x) * (lam < 0 ? Math.max(0, k) : k);  // matches the optimiser's captain term
}
// one captain rule everywhere: best value, but an attacker beats a GKP/DEF that only edges it
function capPick(xi, g) {
  const order = xi.slice().sort((a, b) => adjCap(b, g) - adjCap(a, g));
  let cap = order[0], vice = order[1], swapped = null;
  const att = order.find(i => ["MID", "FWD"].includes(P[i]?.pos));
  if (att && att !== cap && ["GKP", "DEF"].includes(P[cap]?.pos) && adjCap(cap, g) - adjCap(att, g) < 0.6) { swapped = cap; vice = cap; cap = att; }
  return { cap, vice, swapped };
}
function bestXI(ids, g, ov = (SB && SB.ov ? SB.ov[g] : null)) {
  const fs = new Set(ov?.start || []), fb = new Set(ov?.bench || []);
  const ps = ids.filter(i => P[i]).slice().sort((a, b) => adjXI(b, g) - adjXI(a, g));
  const MIN = { GKP: 1, DEF: 3, MID: 2, FWD: 1 }, MAX = { GKP: 1, DEF: 5, MID: 5, FWD: 3 };
  const xi = [], cnt = { GKP: 0, DEF: 0, MID: 0, FWD: 0 };
  const need = () => Object.keys(MIN).reduce((a, k) => a + Math.max(0, MIN[k] - cnt[k]), 0);
  const tryAdd = i => {
    const pos = P[i].pos;
    if (xi.includes(i) || xi.length >= 11 || cnt[pos] >= MAX[pos]) return false;
    cnt[pos]++;
    if (xi.length + 1 + need() > 11) { cnt[pos]--; return false; }  // keep the formation possible
    xi.push(i); return true;
  };
  ps.filter(i => fs.has(i)).forEach(tryAdd);                                  // your forced starters
  for (const pos of Object.keys(MIN)) ps.filter(i => P[i].pos === pos && !fb.has(i)).forEach(i => { if (cnt[pos] < MIN[pos]) tryAdd(i); });
  ps.filter(i => !fb.has(i)).forEach(tryAdd);
  ps.forEach(tryAdd);                                                         // only if benching left too few
  const bench = [...ps.filter(i => !xi.includes(i) && P[i].pos === "GKP"), ...ps.filter(i => !xi.includes(i) && P[i].pos !== "GKP")];
  let c = capPick(xi, g), mine = false;
  if (ov?.cap && xi.includes(ov.cap)) {
    mine = true;
    const others = xi.filter(i => i !== ov.cap).sort((a, b) => adjCap(b, g) - adjCap(a, g));
    c = { cap: ov.cap, vice: ov.vice && xi.includes(ov.vice) && ov.vice !== ov.cap ? ov.vice : others[0], swapped: null };
  }
  const pts = xi.reduce((a, i) => a + xpg(i, g), 0) + (c.cap ? xpg(c.cap, g) : 0);
  return { xi, bench, cap: c.cap, vice: c.vice, swapped: c.swapped, pts, capMine: mine };
}

/* ---------- load ---------- */
async function fetchData() {
  const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  return r.json();
}
function ingest(d) {
  D = d; P = {}; D.players.forEach(p => P[p.id] = p);
  T = D.teams; GWS = D.meta.proj_gws; PG = GWS.slice(0, Math.min(S.horizon, GWS.length));
  MINE = new Set(D.squad.map(s => s.id));
  if (!S.trendTeam) S.trendTeam = P[D.squad[0]?.id]?.team || 1;
  _base = null;
  loadSandbox();
  syncPull();
}
async function load() {
  try { ingest(await fetchData()); } catch (e) {
    $("#app").innerHTML = `<p class="empty">The data file could not be loaded. Reload the page to try again.</p>`; return;
  }
  header(); render();
}
setInterval(async () => {
  try { const nd = await fetchData(); if (D && nd.meta.built !== D.meta.built) { ingest(nd); header(); render(); } } catch (e) {}
}, 5 * 60 * 1000);

function countdown(iso) {
  if (!iso) return "–";
  const ms = new Date(iso) - new Date();
  if (ms <= 0) return "Passed";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d ? `${d}d ${h}h` : `${h}h ${m}m`;
}
const ukTime = iso => new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });

function header() {
  const m = D.manager, meta = D.meta;
  $("#teamName").textContent = m.team;
  $("#mgr").textContent = `${m.name} · team ${meta.team_id}`;
  const last = D.history[D.history.length - 1], prev = D.history[D.history.length - 2];
  const mv = prev && last ? prev.rank - last.rank : 0;
  $("#score").innerHTML = `
    <div><span class="lbl">Overall rank</span><b>${rankFmt(m.rank)}</b><span class="${mv >= 0 ? "up" : "down"}" style="font-size:12px">${mv >= 0 ? "▲" : "▼"} ${rankFmt(Math.abs(mv))}</span></div>
    <div><span class="lbl">Points</span><b>${m.points}</b><span class="muted" style="font-size:12px">GW${meta.picks_gw}: ${m.gw_points ?? "–"}</span></div>
    <div><span class="lbl">Bank · FT</span><b>${money(m.bank)} · ${m.free_transfers}</b><span class="muted" style="font-size:12px">value ${money(m.value)}</span></div>
    <div class="deadline"><span class="lbl">GW${meta.next_gw} deadline</span><b id="cd">${countdown(meta.deadline)}</b><span class="muted" style="font-size:12px">${meta.deadline ? ukTime(meta.deadline) : ""}</span></div>`;
  const built = new Date(meta.built), ageH = (Date.now() - built) / 36e5;
  $("#meta").innerHTML = `<span>Data updated ${built.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" })}${ageH > 3 ? ' <span class="pill warn">stale</span>' : ""}</span>
    <span>Squad shown is your GW${meta.picks_gw} team. Transfers you make on the FPL site show up after the deadline.</span>
    <button class="btn" data-refresh="1">${REFRESH.busy ? "Refreshing…" : "Refresh data now"}</button><span id="refreshMsg">${esc(REFRESH.msg)}</span>
    <button class="btn" data-sync="1">${syncToken() ? "Sync on" : "Sync plan"}</button><span id="syncMsg">${esc(SYNC.msg || "")}</span>`;
  const rb = $("#meta [data-refresh]"); if (rb) rb.onclick = () => { if (!REFRESH.busy) startRefresh(); };
  const sb2 = $("#meta [data-sync]"); if (sb2) sb2.onclick = () => openSync();
}

function setView(v) {
  S.view = v; store.set("fpl.view", v);
  render(); window.scrollTo({ top: 0 });
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === S.view));
  const fn = { week: vWeek, planner: vPlanner, rivals: vRivals, review: vReview, fixtures: vFixtures, players: vPlayers, stats: vStats, chips: vChips, season: vReview, model: vModel }[S.view] || vWeek;
  $("#app").innerHTML = `<section class="view">${fn()}</section>`;
  bind();
}

/* ---------- pitch ---------- */
function card(id, g, o = {}) {
  const p = P[id]; if (!p) return "";
  const badge = o.cap === id ? `<span class="badge">C</span>` : o.vice === id ? `<span class="badge v">V</span>` : "";
  const cls = ["pc", o.sel === id ? "sel" : "", o.fresh?.has(id) ? "newin" : ""].join(" ");
  return `<button class="${cls}" data-${o.act || "p"}="${id}" aria-label="${esc(p.name)}">${flag(p)}${badge}
    <img class="shirt" src="${shirtURL(p)}" srcset="${shirtSet(p)}" sizes="30px" alt="" loading="lazy" onerror="this.remove()">
    <div class="tm">${T[p.team].short} ${p.price.toFixed(1)}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="xp">${f1(xpg(id, g))}</div>
    <div class="fx">${fxChips(p, g, 3)}</div></button>`;
}
// the same image sources the official FPL app uses this season
const shirtBase = p => {
  const special = D.meta.special_shirts && !(D.meta.special_excl || []).includes(p.code);
  return `https://fantasy.premierleague.com/dist/img/shirts/${special ? "special" : "standard"}/shirt_${p.tcode}${p.pos === "GKP" ? "_1" : ""}`;
};
const shirtURL = p => `${shirtBase(p)}-110.webp`;
const shirtSet = p => `${shirtBase(p)}-66.webp 66w, ${shirtBase(p)}-110.webp 110w, ${shirtBase(p)}-220.webp 220w`;
const PHOTO_BASE = "https://resources.premierleague.com/premierleague25/photos/players/110x140";
const photoURL = p => `${PHOTO_BASE}/${p.tmp ? "placeholder" : p.code}.png`;
function pitch(xi, bench, g, o = {}) {
  const rows = ["GKP", "DEF", "MID", "FWD"].map(pos => `<div class="row">${xi.filter(i => P[i]?.pos === pos).map(i => card(i, g, o)).join("")}</div>`).join("");
  return `<div class="pitchwrap"><div class="pitch">${rows}</div><div class="bench"><span class="lbl">Bench</span>${bench.map(i => card(i, g, o)).join("")}</div></div>`;
}

/* ---------- plans ---------- */
const PLAN_LABEL = { roll: "Roll", one: "1 move", two: "2 moves", three: "3 moves", best: "Optimal" };
function planMoves(pl) {
  const mv = [];
  pl.weeks.forEach(w => {
    const outs = w.out.slice();
    w.in.forEach(i => {
      const k = outs.findIndex(o => P[o]?.pos === P[i]?.pos);
      if (k >= 0) mv.push({ gw: w.gw, out: outs.splice(k, 1)[0], in: i });
    });
  });
  return mv;
}
const MODES = { balanced: "Balanced", safe: "Play safe", chase: "Chase rank" };
const MODE_HELP = {
  balanced: "Maximises your projected points.",
  safe: "Sticks closer to what managers around your rank own, so a big haul for a popular player doesn't sink you. Good for protecting a rank.",
  chase: "Favours differentials the managers around you don't own, while keeping the popular players you already have. More swing, up or down, for slightly fewer projected points. Good when you need to climb.",
};
const mk = (k, mode = S.mode) => mode === "balanced" || !D.plans[`${mode}_${k}`] ? k : `${mode}_${k}`;
const planLabel = key => { const [m, k] = key.includes("_") ? key.split("_") : ["balanced", key]; return (m === "balanced" ? "" : MODES[m] + ": ") + PLAN_LABEL[k]; };
function verdict(g, strong = 3, marg = 1) {
  return g >= strong ? { t: "Strong", c: "good" } : g >= marg ? { t: "Marginal", c: "warn" } : { t: "Coin flip", c: "mut" };
}
const vPill = v => `<span class="pill ${v.c}">${v.t}</span>`;
function variance(pos, x) { return pos === "MID" ? 1.9 * x + 0.23 * x * x : ({ GKP: 2.8, DEF: 3.3, FWD: 3.8 }[pos] || 3) * x; }
function spreadVsField(mult, g) {
  const F = D.crowd ? (D.crowd.near?.n >= 100 ? D.crowd.near : D.crowd.top10k) : null;
  if (!F) return null;
  let v = 0;
  D.players.forEach(p => { const x = xpg(p.id, g); if (x <= 0) return; const d = (mult[p.id] || 0) - (F.eo[p.id] || 0) / 100; if (d) v += variance(p.pos, x) * d * d; });
  return Math.sqrt(v);
}
function recommendedPlan(mode = S.mode) {
  const pl = D.plans || {};
  const keys = ["roll", "one", "two", "three"].map(k => mk(k, mode)).filter(k => pl[k]);
  if (!keys.length) return null;
  const best = keys.reduce((a, k) => pl[k].vs_roll > pl[a].vs_roll ? k : a, keys[0]);
  for (const k of keys) if (pl[k].vs_roll >= pl[best].vs_roll - 0.5) return k;  // fewer moves when it's close
  return best;
}
const mvKey = mv => mv.map(m => `${m.gw}:${m.out}>${m.in}`).sort().join(",");
const sameMoves = (a, b) => mvKey(a) === mvKey(b);

/* ---------- your plan: one source of truth for every tab ---------- */
function sbKey() { return `fpl.sb.${D.meta.team_id}.${D.meta.next_gw}.${D.squad.map(s => s.id).join("-")}`; }
function loadSandbox() {
  const keepGw = SB && PG.includes(SB.gw) ? SB.gw : PG[0], keepSel = SB?.sel ?? null;
  const saved = store.get(sbKey());
  SB = { moves: [], source: "", gw: keepGw, sel: keepSel, q: SB?.q || "", prev: SB?.prev || null, ov: {}, rules: { locked: [], banned: [], maxHits: null } };
  if (saved && Array.isArray(saved.moves)) {
    SB.moves = saved.moves.filter(m => P[m.in] && P[m.out] && GWS.includes(m.gw));
    SB.source = saved.source || "custom"; SB.updated = saved.updated || 0;
    applyExtras(saved);
  } else {
    const rec = recommendedPlan();
    SB.moves = rec ? planMoves(D.plans[rec]) : [];
    SB.source = rec ? "plan:" + rec : "custom";
  }
  sanitize();
}
function sbState() { return { moves: SB.moves, source: SB.source, updated: SB.updated, ov: SB.ov, rules: SB.rules, drafts: store.get(sbKey() + ".drafts") || [] }; }
function applyExtras(src) {
  SB.ov = {};
  Object.entries(src.ov || {}).forEach(([g, o]) => { if (GWS.includes(+g)) SB.ov[+g] = o; });
  SB.rules = Object.assign({ locked: [], banned: [], maxHits: null }, src.rules || {});
  SB.rules.locked = SB.rules.locked.filter(i => P[i]); SB.rules.banned = SB.rules.banned.filter(i => P[i]);
}
function saveSandbox() { SB.updated = Date.now(); _base = null; store.set(sbKey(), sbState()); syncPush(); }
function setOv(g, fn) { SB.ov[g] = SB.ov[g] || { start: [], bench: [] }; fn(SB.ov[g]); saveSandbox(); }
function setPlan(moves, source) {
  SB.prev = { moves: SB.moves.slice(), source: SB.source };
  SB.moves = moves.map(m => ({ ...m })); SB.source = source; SB.sel = null;
  sanitize(); saveSandbox();
}
function editPlan(fn) { fn(); SB.source = "custom"; sanitize(); saveSandbox(); }
function planName() {
  if (SB.source.startsWith("replan:")) return "Re-planned" + (SB.source.endsWith("balanced") ? "" : ` (${MODES[SB.source.split(":")[1]]})`);
  if (SB.source.startsWith("plan:")) { const k = SB.source.slice(5); if (D.plans[k] && sameMoves(planMoves(D.plans[k]), SB.moves)) return planLabel(k) + " plan"; }
  return SB.moves.length ? "Your plan" : "No transfers";
}
function squadAt(gw, moves = SB.moves) {
  const s = D.squad.map(x => x.id);
  moves.filter(m => m.gw <= gw).forEach(m => { const k = s.indexOf(m.out); if (k >= 0) s[k] = m.in; });
  return s;
}
function sellPrice(id) { const s = D.squad.find(x => x.id === id); return s ? s.sell : P[id].price; }
function bankAt(gw, moves = SB.moves) {
  let b = D.manager.bank;
  const base = new Set(D.squad.map(x => x.id)), bought = new Set();
  moves.filter(m => m.gw <= gw).forEach(m => {
    b += (base.has(m.out) && !bought.has(m.out)) ? sellPrice(m.out) : P[m.out].price;
    b -= P[m.in].price; bought.add(m.in);
  });
  return Math.round(b * 10) / 10;
}
function cleanMoves(moves) {
  const ok = [], s = D.squad.map(x => x.id);
  moves.slice().sort((a, b) => a.gw - b.gw).forEach(m => {
    if (s.includes(m.out) && !s.includes(m.in)) { ok.push(m); s[s.indexOf(m.out)] = m.in; }
  });
  return ok;
}
function sanitize() { SB.moves = cleanMoves(SB.moves); }
function ftTable(moves = SB.moves) {
  let ft = Math.min(5, D.manager.free_transfers);
  return PG.map(g => {
    const n = moves.filter(m => m.gw === g).length, hits = Math.max(0, n - ft);
    const row = { gw: g, ft, n, hits };
    ft = n > ft ? 1 : Math.min(5, ft - n + 1);
    row.next = ft;
    return row;
  });
}
function clubCounts(ids) { const c = {}; ids.forEach(i => c[P[i].team] = (c[P[i].team] || 0) + 1); return c; }
// the single scorer used by This week, Planner and Rivals
function scoreMoves(moves) {
  let tot = 0;
  const weeks = ftTable(moves).map(r => {
    const sq = squadAt(r.gw, moves), team = bestXI(sq, r.gw);
    tot += team.pts - 4 * r.hits;
    const over = Object.entries(clubCounts(sq)).filter(([, v]) => v > 3).map(([t]) => T[t].short);
    return { ...r, team, sq, bank: bankAt(r.gw, moves), over };
  });
  return { weeks, tot, ftLeft: weeks.length ? weeks[weeks.length - 1].next : 0 };
}
let _base = null;
const baseScore = () => _base || (_base = scoreMoves([]));
function sandboxSummary() {
  const sc = scoreMoves(SB.moves), base = baseScore();

let _pairs = { key: "", list: [] };
function pairSuggestions(g) {

/* ---------- Stats ---------- */
function lineChart(series, labels, { h = 200, yfmt = x => x, title = "" } = {}) {
  const W = 600, pad = { l: 40, r: 12, t: 12, b: 26 };
  const all = series.flatMap(s => s.vals.filter(v => v != null));
  const mx = Math.max(1, ...all), mn = Math.min(0, ...all);
  const nice = mx <= 2 ? 0.5 : mx <= 5 ? 1 : mx <= 12 ? 2 : 5;
  const top = Math.ceil(mx / nice) * nice;
  const x = i => pad.l + (labels.length === 1 ? 0 : i / (labels.length - 1)) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - mn) / (top - mn)) * (h - pad.t - pad.b);
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += nice) ticks.push(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}">
    ${ticks.map(v => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${yfmt(v)}</text>`).join("")}
    ${labels.map((l, i) => `<text x="${x(i)}" y="${h - 8}" text-anchor="middle">${l}</text>`).join("")}
    ${series.map(s => `<polyline class="${s.cls}" fill="none" stroke-width="2.5" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""} points="${s.vals.map((v, i) => `${x(i)},${y(v || 0)}`).join(" ")}"/>${s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v || 0)}" r="3" class="${s.cls}" fill="var(--surface)" stroke-width="2"/>`).join("")}`).join("")}
  </svg>`;
}

  const trendChart = lineChart([{ cls: "s1", vals: tr.map(x => x.xgf) }, { cls: "s4", vals: tr.map(x => x.xga) }], tr.map(x => (x.home ? T[x.opp].short : T[x.opp].short.toLowerCase())), { title: "xG for and against" });

      <span class="lbl">Expected goal involvement per gameweek</span>${lineChart(cps.map((p, i) => ({ cls: cls[i], vals: p.s_xgi })), gwl, { h: 180, yfmt: v => v.toFixed(1) })}`
    : `<p class="muted">Pick players to chart below, or tick them in the Players tab.</p>`;
  const tabs = [["form", "Form"], ["shots", "Shots"], ["sp", "Set pieces"], ["defence", "Defence"], ["bonus", "Bonus"], ["value", "Value"], ["teams", "Teams"]];
  const tab = S.stab || "form";
  const nav = `<div class="seg ptabs" role="tablist" aria-label="Stats sections">${tabs.map(([k, l]) => `<button data-stab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "form") body = `${form}
  <div class="panel"><div class="bar"><h3>Player charts</h3><span class="muted">${cps.length}/4 selected</span></div>${pc}
    <div class="filters" style="margin-top:10px"><input type="search" id="chartq" list="plist" placeholder="Add a player to the chart" aria-label="Add a player to the chart"><datalist id="plist">${D.players.slice(0, 350).map(p => `<option value="${esc(p.name)} (${T[p.team].short})">`).join("")}</datalist>${cps.map(p => `<button class="btn" data-uncmp="${p.id}">✕ ${esc(p.name)}</button>`).join("")}</div></div>
  <div class="statgrid">
    <div class="panel"><h3>Running hot</h3><p class="note" style="margin-top:0">Scoring well above their xG. Finishing streaks rarely last, so expect fewer goals unless the chances rise.</p>${ou(hot)}</div>
    <div class="panel"><h3>Due a goal</h3><p class="note" style="margin-top:0">Getting chances but scoring less than their xG. Often good value before the goals come.</p>${ou(due)}</div>
  </div>`;
  else if (tab === "shots") body = shotsHTML();
  else if (tab === "sp") body = spThreatHTML() + setPiecesHTML();
  else if (tab === "defence") body = dcHTML();
  else if (tab === "bonus") body = bonusHTML();
  else if (tab === "value") body = valueHTML();
  else body = `<div class="grid2">
    <div class="panel"><div class="bar"><h3>Team trend</h3><select id="trendTeam" aria-label="Team" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px">${teamOpts}</select></div>
      <div class="legend"><span><i class="s1"></i>xG for</span><span><i class="s4"></i>xG against</span></div>
      ${trendChart}
      <p class="note">Real scores: ${tr.map(x => `${oppTxt(x)} ${x.gf}–${x.ga}`).join(" · ")}</p></div>
    <div class="panel"><h3>Team ratings</h3><p class="note" style="margin-top:0">1.00 = league average. Attack above 1 scores more; defence below 1 concedes less. Opponent-adjusted.</p>
      <div class="tablebox" style="max-height:420px"><table><thead><tr><th>Team</th><th class="n">Attack</th><th class="n">Defence</th></tr></thead><tbody>${ratings.map(t => `<tr><td>${t.name}</td><td class="n"><span class="minibar" style="width:${t.att * 40}px"></span> ${t.att.toFixed(2)}</td><td class="n"><span class="minibar neg" style="width:${t.def * 40}px"></span> ${t.def.toFixed(2)}</td></tr>`).join("")}</tbody></table></div></div>
  </div>${teamSPHTML()}`;
  return nav + body;
}

function posSeg(key, opts) {

}
const posMatch = (p, f) => f === "ALL" || (f === "ATT" ? (p.pos === "MID" || p.pos === "FWD") : p.pos === f);
function spThreatHTML() {

function teamSPHTML() {

    <div class="tablebox"><table><thead><tr><th>Team</th><th class="n">Set-piece xG for</th><th class="n">Set-piece xG against</th><th class="n">Open-play xG for</th><th class="n">Open-play xG against</th></tr></thead>

}
function dcHTML() {
  const f = S.dcPos || "DEF";
  const thr = f === "DEF" ? 10 : 12;
  // rank by expected DC points next game: the model's (shrunk) chance of hitting the threshold x how nailed he is
  const exp = p => p.dc_rate * Math.min(1, p.nailed / 100);
  const rows = D.players.filter(p => p.dcs && p.dcs.apps >= 4 && posMatch(p, f) && p.pos !== "GKP")
    .sort((a, b) => exp(b) - exp(a) || (b.dcs.per90 - a.dcs.per90)).slice(0, 25);
  return `<div class="panel"><div class="bar"><h3>Defensive contribution leaders</h3>${posSeg("dcPos", [["DEF", "DEF"], ["MID", "MID"], ["FWD", "FWD"]])}</div>
    <p class="note" style="margin-top:0">A ${term("dc", "defensive contribution")} is worth 2 points: ${f === "DEF" ? "10 clearances, blocks, interceptions and tackles" : "12 clearances, blocks, interceptions, tackles and recoveries"} in a match. Hit rate = how often he reached it in games of 60+ minutes. Chance next = the model's estimate for his next game, allowing for small samples and how likely he is to start. Ranked by chance next; at least 4 games of 60+ minutes.</p>
    <div class="tablebox"><table><thead><tr><th>Player</th><th class="n">£m</th><th class="n">Per 90 (need ${thr})</th><th class="n">Hit rate</th><th class="n">Chance next</th><th class="n">DC points</th><th class="n">Last 6</th><th class="n">${term("nailed", "Nailed")}</th><th class="n">xP ${PG.length} GWs</th></tr></thead>

}
function valueHTML() {
  const caps = { GKP: 4.5, DEF: 4.5, MID: 5.0, FWD: 5.5 }, g0 = PG[0], H = PG.length;
  const xf = id => xpFrom(id, g0, H);
  const starters = p => p.ok !== false && p.nailed >= 70 && p.status === "a";
  const enab = Object.keys(caps).map(pos => {
    const list = D.players.filter(p => p.pos === pos && p.price <= caps[pos] && starters(p)).sort((a, b) => xf(b.id) - xf(a.id)).slice(0, 5);
    return `<div><h3 style="font-size:16px;margin:10px 0 6px">${pos} ≤ £${caps[pos].toFixed(1)}m</h3>${list.length ? `<div class="tablebox"><table><tbody>${list.map(p => `<tr class="${MINE.has(p.id) ? "mine" : ""}"><td><button data-p="${p.id}" style="all:unset;cursor:pointer" class="pname">${esc(p.name)}</button> <span class="muted">${T[p.team].short} · £${p.price.toFixed(1)}m</span></td><td class="n">${nailedPill(p)}</td><td class="n"><b>${f1(xf(p.id))}</b></td><td><span class="fx sgfx">${fxChips(p, g0, 4)}</span></td></tr>`).join("")}</tbody></table></div>` : '<p class="muted">No regular starters at this price.</p>'}</div>`;
  }).join("");
  // rotation pairs: two cheap players from different clubs; start whichever has the better fixture each week
  const pairsFor = (pos, cap, minEach) => {
    const ps = D.players.filter(p => p.pos === pos && p.price <= cap && starters(p) && xf(p.id) >= minEach).sort((a, b) => xf(b.id) - xf(a.id)).slice(0, 25);
    const out = [];
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const a = ps[i], b = ps[j]; if (a.team === b.team) continue;
      const tot = PG.reduce((s2, g) => s2 + Math.max(xpg(a.id, g), xpg(b.id, g)), 0);
      out.push({ a, b, tot, cost: a.price + b.price, best1: Math.max(xf(a.id), xf(b.id)) });
    }
    return out.sort((x, y) => y.tot - x.tot).slice(0, 4);
  };
  const pairTable = (list) => list.length ? `<div class="tablebox"><table><thead><tr><th>Pair</th><th class="n">£m</th><th class="n">xP rotating</th>${PG.map(g => `<th>GW${g}</th>`).join("")}</tr></thead><tbody>${list.map(r => `<tr><td><span class="pname">${esc(r.a.name)}</span> <span class="muted">${T[r.a.team].short}</span> + <span class="pname">${esc(r.b.name)}</span> <span class="muted">${T[r.b.team].short}</span></td><td class="n">${r.cost.toFixed(1)}</td><td class="n"><b>${f1(r.tot)}</b> <span class="muted">(+${f1(r.tot - r.best1)})</span></td>${PG.map(g => { const s2 = xpg(r.a.id, g) >= xpg(r.b.id, g) ? r.a : r.b; return `<td>${esc(s2.name)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>` : '<p class="muted">No suitable pairs.</p>';
  return `<div class="panel"><h3>Budget enablers</h3><p class="note" style="margin-top:0">The best cheap players who actually start (Nailed 70+), by projected points over ${H} GWs. Filling these spots well frees money for premiums.</p>
      <div class="statgrid">${enab}</div></div>
    <div class="panel"><h3>Rotation pairs</h3><p class="note" style="margin-top:0">Two cheap players from different clubs: start whichever has the better fixture each week. The bracket shows how much the pair adds over just starting the better one every week.</p>
      <h3 style="font-size:16px;margin:6px 0">Goalkeepers ≤ £5.0m each</h3>${pairTable(pairsFor("GKP", 5.0, 0))}
      <h3 style="font-size:16px;margin:14px 0 6px">Defenders ≤ £5.0m each</h3>${pairTable(pairsFor("DEF", 5.0, 0))}</div>`;
}

/* ---------- Chips ---------- */
function vChips() {
  const g = D.meta.next_gw;
  const chips = D.chips.map(c => `<div class="chip ${c.used ? "used" : ""}"><h3>${c.name}</h3><span class="muted">GW${c.from}–${c.to}</span><div style="margin-top:6px">${c.used ? `<span class="pill mut">Used GW${c.used}</span>` : c.available ? `<span class="pill good">Available</span>` : `<span class="pill bad">Expired</span>`}</div></div>`).join("");
  const rows = (D.gw_info || []).map(r => `<tr><td>GW${r.gw}</td><td class="n">${r.squad_playing}/15</td><td class="n">${f1(r.bench_xp)}</td><td>${esc(P[r.tc_player]?.name || "–")}</td><td class="n">${f1(r.tc_xp * 3)}</td></tr>`).join("");
  const dgw = D.season_gws.filter(r => r.gw >= g && (r.doubles.length || r.blanks.length));
  const tc1 = D.chips.find(c => c.key === "3xc" && c.to <= 19);
  const bestTc = (D.gw_info || []).reduce((a, r) => (!a || r.tc_xp > a.tc_xp) ? r : a, null);
  const adv = [];
  if (tc1 && tc1.available) adv.push(`Your first-half <b>Triple Captain</b> must be played by GW${tc1.to}. ${dgw.some(r => r.gw <= tc1.to && r.doubles.length) ? "A double gameweek falls before then, which is the best spot." : `No doubles are scheduled before then, so aim it at the best single fixture. In view now: <b>GW${bestTc.gw}</b> (${esc(P[bestTc.tc_player]?.name)}, ${f1(bestTc.tc_xp * 3)} pts with TC).`}`);
  adv.push("The second set of chips unlocks in GW20. Save Bench Boost and Free Hit for the doubles and blanks, which usually get announced around the cup rounds.");
  return `<div class="panel"><h2 style="margin-bottom:12px">Chip planner</h2><p class="verdict">${adv.join("<br><br>")}</p></div>
    <div class="chips">${chips}</div>
    <div class="panel"><h3>Your squad, next ${(D.gw_info || []).length} gameweeks</h3><div class="tablebox"><table><thead><tr><th>GW</th><th class="n">Playing</th><th class="n">Bench xP</th><th>Best captain</th><th class="n">TC xP</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">${dgw.length ? `Known blanks/doubles: ${dgw.map(r => `GW${r.gw}${r.doubles.length ? " double: " + r.doubles.join(", ") : ""}${r.blanks.length ? " blank: " + r.blanks.join(", ") : ""}`).join("; ")}.` : "No blank or double gameweeks are scheduled yet. This updates automatically when the fixture list changes."}</p></div>`;
}

/* ---------- Season ---------- */
function rankChart(h) {
  const W = 640, H = 220, pad = { l: 64, r: 16, t: 14, b: 28 };
  const ranks = h.map(x => x.rank), lo = Math.log10(Math.min(...ranks)), hi = Math.log10(Math.max(...ranks)), span = Math.max(0.3, hi - lo);
  const y = r => pad.t + (Math.log10(r) - (lo - 0.05)) / (span + 0.1) * (H - pad.t - pad.b);
  const x = i => pad.l + (h.length === 1 ? 0 : i / (h.length - 1)) * (W - pad.l - pad.r);
  const ticks = [];
  for (let e = Math.floor(lo); e <= Math.ceil(hi); e++) [1, 2, 5].forEach(m => { const v = m * 10 ** e; if (Math.log10(v) >= lo - 0.05 && Math.log10(v) <= hi + 0.05) ticks.push(v); });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall rank by gameweek">
    ${ticks.map(t => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1e6 ? t / 1e6 + "m" : t >= 1e3 ? t / 1e3 + "k" : t}</text>`).join("")}
    <polyline points="${h.map((d, i) => `${x(i)},${y(d.rank)}`).join(" ")}" fill="none" class="s1" stroke-width="2.5"/>
    ${h.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.rank)}" r="${i === h.length - 1 ? 5 : 3}" fill="${i === h.length - 1 ? "var(--armband)" : "var(--turf-2)"}"/><text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.gw}</text>`).join("")}</svg>`;
}
function vReview() {
  const h = D.history, L = D.live, R = D.review, mx = Math.max(...h.map(x => x.pts));
  const live = L && !L.finished ? `<div class="panel"><div class="bar"><h3>GW${L.gw} live</h3><span class="muted">${L.points} pts · average ${L.average ?? "–"}</span></div>
    <div class="tablebox"><table><thead><tr><th>Player</th><th class="n">Mins</th><th class="n">BPS</th><th class="n">Bonus</th><th class="n">Pts</th><th class="n">Counted</th></tr></thead><tbody>${L.rows.map(r => `<tr><td><span class="pname">${esc(P[r.id]?.name || r.id)}</span>${r.cap ? ' <span class="pill warn">C</span>' : r.vice ? ' <span class="pill mut">V</span>' : ""}${r.pos > 11 ? ' <span class="muted">bench</span>' : ""}</td><td class="n">${r.mins}</td><td class="n">${r.bps}</td><td class="n">${r.bonus}</td><td class="n">${r.pts}</td><td class="n"><b>${r.pts * r.mult}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="note">As of the last update. Bonus is provisional until FPL confirms it.</p></div>` : "";
  if (!R || !R.weeks.length) return live + `<div class="panel"><p class="muted">Your review appears after the first gameweek finishes.</p></div>`;
  const w = R.weeks[R.weeks.length - 1], Tt = R.totals;
  const nm = id => esc(P[id]?.name || "?");
  const lines = [];
  lines.push(w.cap_lost > 0 ? ["warn", `Captain: ${nm(w.captain)} scored ${w.cap_pts}. ${nm(w.best_cap)} would have scored ${w.best_cap_pts} (−${w.cap_lost}).${w.model_cap && w.model_cap !== w.captain ? ` The model's pick was ${nm(w.model_cap)}.` : ""}`] : ["good", `Captain: ${nm(w.captain)} was the best choice in your XI (${w.cap_pts} pts).`]);
  lines.push(w.bench_pts >= 8 && w.chip !== "bboost" ? ["warn", `Bench: ${w.bench_pts} points left on the bench.`] : ["good", `Bench: only ${w.bench_pts} points left on the bench.`]);
  if (w.moves.length) { const net = w.moves.reduce((a, m) => a + m.in_pts - m.out_pts, 0) - w.hits; lines.push([net >= 0 ? "good" : "warn", `Transfers: ${w.moves.map(m => `${nm(m.out)} → ${nm(m.in)} (${m.out_pts} → ${m.in_pts})`).join(", ")}${w.hits ? `, −${w.hits} hit` : ""}. Net ${net >= 0 ? "+" : ""}${net} this week.`]); }
  else if (w.wildcard || w.freehit) lines.push(["info", `${w.wildcard ? "Wildcard" : "Free Hit"} week: ${w.n_tx} changes.`]);
  else lines.push(["info", "Transfers: none made."]);
  if (w.xi_proj != null) lines.push(["info", `Model: your starting XI was projected ${f1(w.xi_proj)} (before captain) and scored ${w.xi_actual}.`]);
  const best = R.transfers.slice().sort((a, b) => b.gain - a.gain).slice(0, 5), worst = R.transfers.slice().sort((a, b) => a.gain - b.gain).slice(0, 5);
  const txl = list => `<div class="tablebox"><table><thead><tr><th>GW</th><th>Move</th><th class="n">GWs</th><th class="n">Net</th></tr></thead><tbody>${list.map(t => `<tr><td>${t.gw}${t.wildcard ? ' <span class="tag">WC</span>' : ""}</td><td>${nm(t.out)} → ${nm(t.in)}</td><td class="n">${t.gws}</td><td class="n ${t.gain >= 0 ? "up" : "down"}">${t.gain > 0 ? "+" : ""}${t.gain}</td></tr>`).join("")}</tbody></table></div>`;
  return `${live}
  <div class="grid2">
    <div class="panel"><div class="bar"><h2>GW${w.gw} review</h2><span class="muted">${w.pts} pts${w.hits ? ` (−${w.hits})` : ""} · average ${w.avg ?? "–"} · your best possible ${w.best_possible}</span></div>
      <ul class="alerts">${lines.map(([c, t]) => `<li class="${c}"><span>${t}</span></li>`).join("")}</ul></div>
    <div class="panel"><h3>Season so far</h3>
      <div class="kpis">
        <div class="kpi"><span class="lbl">Lost to captaincy</span><b class="${Tt.cap_lost > 0 ? "down" : ""}">${Tt.cap_lost}</b><span class="delta muted">vs best captain in your XI</span></div>
        <div class="kpi"><span class="lbl">Left on bench</span><b>${Tt.bench}</b><span class="delta muted">excluding Bench Boost</span></div>
        <div class="kpi"><span class="lbl">Transfers net</span><b class="${Tt.tx_gain - Tt.hits >= 0 ? "up" : "down"}">${Tt.tx_gain - Tt.hits >= 0 ? "+" : ""}${Tt.tx_gain - Tt.hits}</b><span class="delta muted">after ${Tt.hits} pts of hits; Wildcard ${Tt.wc_gain >= 0 ? "+" : ""}${Tt.wc_gain}</span></div>
      </div><p class="note">Transfer net = points the new player scored minus what the old player would have scored, while you kept him.</p></div>
  </div>
  <div class="panel"><h3>Week by week</h3><div class="tablebox"><table><thead><tr><th>GW</th><th class="n">Pts</th><th class="n">Avg</th><th class="n">Rank</th><th>Captain</th><th class="n">Cap lost</th><th class="n">Bench</th><th class="n">Best possible</th><th class="n">Model XI</th><th>Chip</th></tr></thead>
    <tbody>${R.weeks.slice().reverse().map(x => `<tr><td>${x.gw}</td><td class="n"><b>${x.pts}</b>${x.hits ? ` <span class="down">−${x.hits}</span>` : ""}</td><td class="n">${x.avg ?? "–"}</td><td class="n">${rankFmt(x.rank)}</td><td>${nm(x.captain)} <span class="muted">${x.cap_pts}</span></td><td class="n ${x.cap_lost ? "down" : ""}">${x.cap_lost ? "−" + x.cap_lost : "0"}</td><td class="n">${x.bench_pts}</td><td class="n">${x.best_possible}</td><td class="n">${x.xi_proj != null ? `${f1(x.xi_proj)} → ${x.xi_actual}` : "–"}</td><td>${x.chip ? `<span class="tag">${({ "3xc": "TC", bboost: "BB", freehit: "FH", wildcard: "WC" })[x.chip] || x.chip}</span>` : ""}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="statgrid"><div class="panel"><h3>Best transfers</h3>${txl(best)}</div><div class="panel"><h3>Worst transfers</h3>${txl(worst)}</div></div>
  <div class="grid2"><div class="panel"><h3>Overall rank</h3>${rankChart(h)}</div>
    <div class="panel"><h3>Points per gameweek</h3><div class="gwbars">${h.map(x => `<div title="GW${x.gw}: ${x.pts} pts"><span class="num" style="color:var(--fg);font-weight:600">${x.pts}</span><i style="height:${x.pts / mx * 60}px;${x.chip ? "background:var(--armband)" : ""}"></i>${x.gw}</div>`).join("")}</div>
    <p class="note">Gold bars = chip weeks.</p></div></div>`;
}

/* ---------- Model ---------- */
function vModel() {
  const A = D.accuracy;
  const acc = A ? `<div class="panel"><h2 style="margin-bottom:10px">How accurate is it?</h2>
    <p>Each finished gameweek (GW${A.gws[0]}–${A.gws[A.gws.length - 1]}) was projected again using only the data available before it, then compared with the real points of ${A.n.toLocaleString("en-GB")} player appearances.</p>
    <div class="kpis"><div class="kpi"><span class="lbl">Correlation with real points</span><b>${A.corr.toFixed(2)}</b><span class="delta muted">recent-points average: ${A.base_corr.toFixed(2)}</span></div>
      <div class="kpi"><span class="lbl">Typical miss (RMSE)</span><b>${A.rmse.toFixed(2)}</b><span class="delta muted">recent-points average: ${A.base_rmse.toFixed(2)}</span></div>
      <div class="kpi"><span class="lbl">Average miss</span><b>${A.mae.toFixed(2)}</b><span class="delta muted">points per player per GW</span></div></div>
    <h3 style="margin:16px 0 6px">Calibration</h3><p class="note" style="margin-top:0">When the model says a player will score about X, how many did players actually score on average?</p>
    <div class="tablebox"><table><thead><tr><th>Projected</th><th class="n">Players</th><th class="n">Avg projected</th><th class="n">Avg actual</th></tr></thead><tbody>${A.buckets.map(([b, c, px, pa]) => `<tr><td>${b}–${b + 1} pts</td><td class="n">${c}</td><td class="n">${px.toFixed(2)}</td><td class="n">${pa.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Single-gameweek FPL points are very noisy: a correlation around 0.4 is about as good as public models get. The value is in ranking players sensibly and avoiding bad bets, not in calling exact scores.</p></div>` : "";
  return `${acc}<div class="panel" style="max-width:800px"><h2 style="margin-bottom:10px">How the projections work</h2>
  <ul>
    <li><b>Team strength.</b> Attack and defence ratings from expected goals for and against in every match (70%) plus real goals (30%). They're adjusted for the opponents each team has faced and for home advantage, and pulled towards average while the sample is small.</li>
    <li><b>Fixtures.</b> Projected goals = league average (${D.meta.league_goals}) × attack × opponent defence × home/away. Clean-sheet and goals-conceded chances come from that, calibrated to real clean-sheet rates.</li>
    <li><b>Minutes.</b> How often a player starts or comes off the bench, and how long they play, over the last 5 gameweeks (recent games count more), times FPL's chance-of-playing flag.</li>
    <li><b>Player output.</b> xG and xA per 90 this season (recent games count more), blended with ${D.meta.priors_season || "last season"} and the two seasons before it, plus a positional average. First-choice penalty takers get a small boost. Assists are scaled up because FPL awards more assists than xA counts.</li>
    <li><b>Defensive contributions.</b> The chance of reaching the CBIT threshold, from each player's hit rate and their per-90 rate.</li>
    <li><b>Calibration.</b> The raw projections are adjusted so that, across past gameweeks, projected and real averages match (see the table above).</li>
    <li><b>Transfer plans.</b> An optimiser plans the next 5 gameweeks together: transfers, lineups and captains, within budget, squad shape, the 3-per-club rule and free-transfer rules. A banked free transfer is valued at 1.5 points.</li>
  </ul>
  <p class="note">Selling prices and free transfers are estimated from your public transfer history, because FPL only shows exact values when you're signed in. The model and data are updated every 30 minutes.</p></div>`;
}
