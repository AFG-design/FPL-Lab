/* ---------- events ---------- */
function bind() {
  const on = (sel, fn, ev = "onclick") => document.querySelectorAll(sel).forEach(el => el[ev] = () => fn(el));
  on("[data-p]", b => openPlayer(+b.dataset.p));
  on("[data-fx]", b => { S.fxMode = b.dataset.fx; render(); });
  on("[data-field]", b => { S.field = b.dataset.field; render(); });
  on("[data-mode]", b => {
    S.mode = b.dataset.mode; store.set("fpl.mode", S.mode);
    // a plan picked from the options follows the strategy; a hand-edited plan is kept
    if (SB.source.startsWith("plan:")) { const k = recommendedPlan(); if (k) setPlan(planMoves(D.plans[k]), "plan:" + k); }
    render();
  });
  on("[data-sync]", () => openSync());
  on("[data-replan]", () => runReplan());
  on("[data-horizon]", b => { setHorizon(+b.dataset.horizon); render(); });
  on("[data-pair]", b => {
    const [o1, n1, o2, n2] = b.dataset.pair.split(":").map(Number), g = SB.gw;
    SB.prev = { moves: SB.moves.slice(), source: SB.source };
    editPlan(() => {
      for (const [o, n] of [[o1, n1], [o2, n2]]) {
        const same = SB.moves.find(m => m.gw === g && m.in === o);
        if (same) same.in = n; else { SB.moves = SB.moves.filter(m => !(m.gw >= g && m.out === o)); SB.moves.push({ gw: g, out: o, in: n }); }
      }
    });
    render();
  });
  on("[data-draftsave]", () => {
    const ds = getDrafts(); if (ds.length >= 3) return;
    const name = ($("#draftName")?.value || "").trim() || `Draft ${ds.length + 1}`;
    ds.push({ name, moves: SB.moves.map(m => ({ ...m })), ov: JSON.parse(JSON.stringify(SB.ov)), mode: S.mode, saved: Date.now() });
    setDrafts(ds); render();
  });
  on("[data-draftload]", b => {
    const d = getDrafts()[+b.dataset.draftload]; if (!d) return;
    SB.prev = { moves: SB.moves.slice(), source: SB.source };
    SB.ov = JSON.parse(JSON.stringify(d.ov || {}));
    if (d.mode && MODES[d.mode]) { S.mode = d.mode; store.set("fpl.mode", S.mode); }
    setPlan(d.moves, "custom"); render();
  });
  on("[data-draftdel]", b => { const ds = getDrafts(); ds.splice(+b.dataset.draftdel, 1); setDrafts(ds); render(); });
  on("[data-ptab]", b => { S.ptab = b.dataset.ptab; store.set("fpl.ptab", S.ptab); render(); });
  on("[data-sugg]", b => {
    const [o, n] = b.dataset.sugg.split(":").map(Number), g = SB.gw;
    SB.prev = { moves: SB.moves.slice(), source: SB.source };
    editPlan(() => {
      const same = SB.moves.find(m => m.gw === g && m.in === o);
      if (same) same.in = n; else { SB.moves = SB.moves.filter(m => !(m.gw >= g && m.out === o)); SB.moves.push({ gw: g, out: o, in: n }); }
    });
    render();
  });
  on("[data-unrule]", b => { const [kind, id] = b.dataset.unrule.split(":"); SB.rules[kind] = SB.rules[kind].filter(x => x !== +id); saveSandbox(); render(); });
  const hs = $("#hitsSel"); if (hs) hs.onchange = e => { SB.rules.maxHits = e.target.value === "" ? null : +e.target.value; saveSandbox(); };
  on("[data-act]", b => {
    const g = SB.gw, id = SB.sel, a = b.dataset.act;
    if (a === "lock") { SB.rules.locked = SB.rules.locked.includes(id) ? SB.rules.locked.filter(x => x !== id) : [...SB.rules.locked, id]; SB.rules.banned = SB.rules.banned.filter(x => x !== id); saveSandbox(); }
    else if (a === "reset") { delete SB.ov[g]; saveSandbox(); }
    else setOv(g, o => {
      o.start = o.start || []; o.bench = o.bench || [];
      if (a === "cap") o.cap = o.cap === id ? null : id;
      if (a === "vice") o.vice = o.vice === id ? null : id;
      if (a === "bench") { if (o.start.includes(id)) o.start = o.start.filter(x => x !== id); o.bench = [...new Set([...o.bench, id])]; if (o.cap === id) o.cap = null; }
      if (a === "start") { if (o.bench.includes(id)) o.bench = o.bench.filter(x => x !== id); o.start = [...new Set([...o.start, id])]; }
    });
    render();
  });
  on("[data-rival]", b => { S.rival = +b.dataset.rival || null; render(); if (S.rival && innerWidth < 900) document.querySelector(".grid2 > div:last-child")?.scrollIntoView({ behavior: "smooth" }); });
  const ls = $("#leagueSel"); if (ls) ls.onchange = e => { S.league = +e.target.value; S.rival = null; render(); };
  on("[data-plan]", b => { const k = b.dataset.plan; setPlan(planMoves(D.plans[k]), "plan:" + k); render(); });
  on("[data-loadplan]", b => { const k = b.dataset.loadplan; setPlan(planMoves(D.plans[k]), "plan:" + k); render(); });
  on("[data-undoplan]", () => { if (SB.prev) { const p = SB.prev; SB.prev = null; SB.moves = p.moves; SB.source = p.source; sanitize(); saveSandbox(); render(); } });
  on("[data-v-go]", b => setView(b.dataset.vGo));
  on("[data-sbgw]", b => { SB.gw = +b.dataset.sbgw; SB.sel = null; render(); });
  on("[data-sbp]", b => { const id = +b.dataset.sbp; SB.sel = SB.sel === id ? null : id; SB.q = ""; render(); if (SB.sel && innerWidth < 900) $("#candPanel")?.scrollIntoView({ behavior: "smooth" }); });
  on("[data-cancel]", () => { SB.sel = null; render(); });
  on("[data-pick]", b => {
    const g = SB.gw, out = SB.sel, inn = +b.dataset.pick;
    // a move from this GW replaces the player for all later weeks; drop later moves of the same player
    SB.prev = { moves: SB.moves.slice(), source: SB.source };
    editPlan(() => {
      const same = SB.moves.find(m => m.gw === g && m.in === out);
      if (same) { same.in = inn; if (same.in === same.out) SB.moves = SB.moves.filter(m => m !== same); }  // swap a signing made this week: still one transfer
      else { SB.moves = SB.moves.filter(m => !(m.gw >= g && m.out === out)); SB.moves.push({ gw: g, out, in: inn }); }
    });
    SB.sel = null; render();
  });
  on("[data-undo]", b => { SB.prev = { moves: SB.moves.slice(), source: SB.source }; editPlan(() => SB.moves.splice(+b.dataset.undo, 1)); render(); });
  on("[data-reset]", () => { setPlan([], "custom"); render(); });
  on("th[data-sort]", th => { const k = th.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = ["name", "team", "pos"].includes(k) ? 1 : -1; } render(); });
  on("[data-stsort]", th => { S.stSort = th.dataset.stsort; render(); });
  on("[data-stab]", b => { S.stab = b.dataset.stab; store.set("fpl.stab", S.stab); render(); });
  on("[data-posseg]", b => { const [k, v] = b.dataset.posseg.split(":"); S[k] = v; render(); });
  on("[data-shsort]", th => { S.shSort = th.dataset.shsort; render(); });
  on("[data-bosort]", th => { S.boSort = th.dataset.bosort; render(); });
  on("[data-stpos]", b => { S.stPos = b.dataset.stpos; render(); });
  on("[data-cmp]", c => { const id = +c.dataset.cmp; if (c.checked) { if (S.cmp.length >= 4) S.cmp.shift(); S.cmp.push(id); } else S.cmp = S.cmp.filter(x => x !== id); render(); }, "onchange");
  on("[data-uncmp]", b => { S.cmp = S.cmp.filter(x => x !== +b.dataset.uncmp); render(); });
  const tsel = $("#trendTeam"); if (tsel) tsel.onchange = e => { S.trendTeam = +e.target.value; render(); };
  const cq = $("#chartq");
  if (cq) cq.onchange = () => {
    const v = cq.value; const p = D.players.find(p => `${p.name} (${T[p.team].short})` === v);
    if (p && !S.cmp.includes(p.id)) { if (S.cmp.length >= 4) S.cmp.shift(); S.cmp.push(p.id); render(); }
  };
  const live = (id, key, obj) => {
    const el = $(id); if (!el) return;
    el.oninput = () => { obj[key] = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); };
  };
  live("#q", "q", S); live("#candq", "q", SB);
  const fp = $("#fpos"); if (fp) { fp.onchange = e => { S.pos = e.target.value; render(); }; $("#fteam").onchange = e => { S.team = e.target.value; render(); }; $("#fmax").onchange = e => { S.maxp = e.target.value; render(); }; }
}


/* ---------- tap-to-explain ---------- */
const GLOSS = {
  xp: ["xP (projected points)", "The points the model expects a player to score, averaged over all the ways a match can go. 4–5 is a strong week for most players."],
  xgi: ["xGI", "Expected goal involvement: expected goals (xG) plus expected assists (xA). It measures the quality of chances a player gets or creates, regardless of whether they went in. Per 90 = per full match."],
  eo: ["EO (effective ownership)", "The share of managers who own a player, with captains counted twice. A player at 150% EO gains the field 1.5 points for every point he scores, so if you don't own him, you lose ground when he does well."],
  nailed: ["Nailed", "How sure a player is to start and play most of the game, from 0 to 100. It uses his recent starts, how long he plays and any injury flag. 85+ is nailed on; under 60 is a rotation risk."],
  spread: ["Spread vs field", "How far your score typically lands from the managers around your rank in a gameweek. ±5 means you'll usually be within about 5 points of them. Lower is safer; higher is riskier, but gives you more chance to climb."],
  swing: ["Swing", "How much a player's projected points move you against the field: your share of his points minus theirs. A negative swing means the field gains on you if he delivers."],
  bps: ["BPS (bonus point system)", "FPL's in-match score for every action: goals, key passes, tackles, saves and more. The top 3 BPS in each match earn 3, 2 and 1 bonus points."],
  bigchance: ["Big chance", "A shot worth 0.3 xG or more: a clear chance a player would usually be expected to score, such as a one-on-one or a close-range header. Opta's own definition is similar."],
  inbox: ["Shots in the box", "Shots taken from inside the penalty area, where most goals come from. More reliable than total shots, which include long-range efforts."],
  created: ["Chances created", "Shots a player set up with a pass (key passes). Big chances created are those worth 0.3 xG or more."],
  ft: ["Free transfers", "You get 1 a week and can bank up to 5. Moves beyond your free transfers cost 4 points each (a hit)."],
  hit: ["Hit", "A transfer beyond your free ones costs 4 points. Worth it only if the new player outscores the old one by more than 4 over the weeks you keep him."],
  dc: ["Defensive contributions (DC)", "2 points for reaching a defensive threshold in a match: 10 clearances, blocks, interceptions and tackles for defenders, or 12 (including recoveries) for midfielders and forwards."],
  xmins: ["xMins", "Expected minutes next gameweek, from recent starts and FPL's chance-of-playing flag."],
  verdict: ["Verdicts", "Strong: a clear gain worth acting on. Marginal: a small edge. Coin flip: the options are too close for the model to call, so go with your judgement. Safe pick: what most managers around your rank are doing."],
  strategy: ["Strategy", "Balanced maximises your projected points. Play safe sticks closer to what managers around your rank own. Chase rank goes for differentials: more swing, up or down."],
  horizon: ["Plan length", "How many gameweeks the planner, suggestions and Re-plan look ahead. 3 GWs favours players with good short-term fixtures. 6 GWs favours longer-term value and fewer hits. Moves after the last gameweek are kept but don't count."],
  l4: ["L4 / L6", "Over the last 4 or 6 gameweeks. Recent form, which reacts faster to changes in role or team than whole-season numbers."],
};
function term(key, label) { return `<button type="button" class="term" data-term="${key}">${label ?? GLOSS[key]?.[0] ?? key}</button>`; }
function showTerm(btn) {
  const g = GLOSS[btn.dataset.term]; if (!g) return;
  let tip = $("#tip");
  if (!tip) { tip = document.createElement("div"); tip.id = "tip"; tip.setAttribute("role", "dialog"); document.body.appendChild(tip); }
  tip.innerHTML = `<b>${esc(g[0])}</b><p>${esc(g[1])}</p>`;
  tip.hidden = false;
  const r = btn.getBoundingClientRect(), w = Math.min(320, innerWidth - 32);
  tip.style.width = w + "px";
  tip.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left)) + "px";
  const below = r.bottom + 8, h = tip.offsetHeight;
  tip.style.top = (below + h > innerHeight - 12 ? Math.max(12, r.top - h - 8) : below) + "px";
}
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (t) { e.preventDefault(); e.stopPropagation(); showTerm(t); return; }
  const tip = $("#tip"); if (tip && !tip.hidden && !e.target.closest("#tip")) tip.hidden = true;
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") { const tip = $("#tip"); if (tip) tip.hidden = true; } });
addEventListener("scroll", () => { const tip = $("#tip"); if (tip) tip.hidden = true; }, { passive: true });

/* ---------- one-tap refresh (starts the GitHub job; needs a token with Actions access) ---------- */
const REFRESH = { busy: false, msg: "", poll: null };
async function startRefresh() {
  if (!syncToken()) { window.open(`https://github.com/${REPO}/actions/workflows/refresh.yml`, "_blank", "noopener"); return; }
  REFRESH.busy = true; REFRESH.msg = ""; header();
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/refresh.yml/dispatches`, {
      method: "POST", headers: { ...syncHeaders(true), "Content-Type": "application/json" }, body: JSON.stringify({ ref: "main" }) });
    if (r.status === 204) {
      REFRESH.msg = "Refresh started. New data usually arrives in 3–6 minutes and the page updates itself.";
      const built = D.meta.built; let n = 0;
      clearInterval(REFRESH.poll);
      REFRESH.poll = setInterval(async () => {
        n++;
        try { const nd = await fetchData(); if (nd.meta.built !== built) { clearInterval(REFRESH.poll); REFRESH.busy = false; REFRESH.msg = "Updated just now."; ingest(nd); header(); render(); return; } } catch (e) {}
        if (n > 40) { clearInterval(REFRESH.poll); REFRESH.busy = false; REFRESH.msg = "Still waiting on GitHub. The data will update when the job finishes."; header(); }
      }, 20000);
    } else if (r.status === 401 || r.status === 403 || r.status === 404) {
      REFRESH.busy = false;
      REFRESH.msg = "Your token can't start the refresh. Give it Actions: Read and write (Sync plan → instructions), or use GitHub's Run workflow button.";
    } else { REFRESH.busy = false; REFRESH.msg = "GitHub said " + r.status + ". Try again in a minute."; }
  } catch (e) { REFRESH.busy = false; REFRESH.msg = "Couldn't reach GitHub. Check your connection."; }
  header();
}

/* ---------- plan sync between devices (GitHub, "sync" branch) ---------- */
const SYNC = { branch: "sync", path: "plan.json", msg: "", timer: null, busy: false };
const syncToken = () => { try { return localStorage.getItem("fpl.gh") || ""; } catch (e) { return ""; } };
const b64e = str => btoa(unescape(encodeURIComponent(str)));
const b64d = str => decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
function syncHeaders(auth) {
  const h = { Accept: "application/vnd.github+json" };
  if (auth && syncToken()) h.Authorization = "Bearer " + syncToken();
  return h;
}
async function syncGet() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${SYNC.path}?ref=${SYNC.branch}&t=${Date.now()}`, { headers: syncHeaders(true), cache: "no-store" });
  if (r.status === 404) return { doc: { plans: {} }, sha: null };
  if (!r.ok) throw new Error("GitHub said " + r.status);
  const j = await r.json();
  return { doc: JSON.parse(b64d(j.content)), sha: j.sha };
}
function setSyncMsg(t) { SYNC.msg = t; const el = $("#syncMsg"); if (el) el.textContent = t; }
async function syncPull() {
  try {
    const { doc } = await syncGet();
    const r = doc.plans?.[sbKey()];
    if (r && (r.updated || 0) > (SB.updated || 0)) {
      SB.moves = (r.moves || []).filter(m => P[m.in] && P[m.out] && GWS.includes(m.gw));
      SB.source = r.source || "custom"; SB.updated = r.updated; applyExtras(r); sanitize(); _base = null;
      if (Array.isArray(r.drafts)) store.set(sbKey() + ".drafts", r.drafts);
      store.set(sbKey(), sbState());
      setSyncMsg("Plan loaded from your other device");
      render();
    }
  } catch (e) { /* offline or rate-limited: local plan stays */ }
}
function syncPush() {
  if (!syncToken()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(async () => {
    if (SYNC.busy) return syncPush();
    SYNC.busy = true; setSyncMsg("Syncing…");
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const { doc, sha } = await syncGet();
        doc.plans = doc.plans || {};
        const cutoff = Date.now() - 30 * 864e5;
        Object.keys(doc.plans).forEach(k => { if ((doc.plans[k].updated || 0) < cutoff) delete doc.plans[k]; });
        doc.plans[sbKey()] = sbState();
        const body = { message: "Plan sync", content: b64e(JSON.stringify(doc)), branch: SYNC.branch };
        if (sha) body.sha = sha;
        const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${SYNC.path}`, { method: "PUT", headers: { ...syncHeaders(true), "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (r.ok) { setSyncMsg("Plan synced"); break; }
        if (r.status === 401 || r.status === 403) { setSyncMsg("Sync failed: the token was refused. Check it in Sync settings."); break; }
        if (attempt) setSyncMsg("Sync failed (" + r.status + "). Your plan is still saved on this device.");
      } catch (e) { if (attempt) setSyncMsg("Sync failed: offline? Your plan is still saved on this device."); }
    }
    SYNC.busy = false;
  }, 1200);
}
function openSync() {
  const has = !!syncToken();
  $("#dlgBody").innerHTML = `<button class="x" aria-label="Close" id="dlgX">×</button>
    <h2>Sync and one-tap refresh</h2>
    <p>Your plan is always saved on this device. Every device can read your synced plan. To save changes from a device to the sync, it needs a GitHub access token, set up once per device.</p>
    <ol style="margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px">
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → new fine-grained token</a>.</li>
      <li>Name it "FPL Lab sync". Under <b>Repository access</b> choose <b>Only select repositories</b> → <b>FPL-Lab</b>.</li>
      <li>Under <b>Permissions</b>, set <b>Contents</b> to <b>Read and write</b> and <b>Actions</b> to <b>Read and write</b>. Contents lets it save your plan; Actions lets the Refresh button start an update. Generate it and copy it.</li>
      <li>Paste it below. It stays in this browser only.</li></ol>
    <div class="filters" style="margin:0"><input id="ghTok" type="password" autocomplete="off" placeholder="${has ? "Token saved. Paste a new one to replace it" : "github_pat_…"}" aria-label="GitHub token" style="flex:1"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="tokSave">Save and sync now</button>${has ? '<button class="btn" id="tokDel">Stop syncing from this device</button>' : ""}</div>
    <p class="note">${esc(SYNC.msg || (has ? "Sync is on for this device." : "Sync is off for this device."))} The plan is stored in your FPL-Lab repository on a separate "sync" branch, so it never triggers a site rebuild.</p>`;
  const dlg = $("#dlg"); dlg.showModal();
  $("#dlgX").onclick = () => dlg.close();
  $("#tokSave").onclick = () => {
    const v = $("#ghTok").value.trim();
    try { if (v) localStorage.setItem("fpl.gh", v); } catch (e) {}
    if (!syncToken()) { setSyncMsg("Paste a token first."); return; }
    SB.updated = Date.now(); store.set(sbKey(), sbState());
    syncPush(); dlg.close(); header();
  };
  const del = $("#tokDel"); if (del) del.onclick = () => { try { localStorage.removeItem("fpl.gh"); } catch (e) {} setSyncMsg("Sync off on this device"); dlg.close(); header(); };
}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
setInterval(() => { const c = $("#cd"); if (c && D) c.textContent = countdown(D.meta.deadline); }, 30000);
load();

</script>
