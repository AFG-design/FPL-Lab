<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BACK2BACK FPL Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: matchday programme — sticky scoreboard header, tabbed sections, a chalk-lined pitch as the hero of "My team" */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dccf; --fg:#17201a; --muted:#5c695f;
  --turf:#1f6b45; --turf-2:#2a8558; --chalk:rgba(255,255,255,.55); --armband:#d99a1c; --armband-fg:#2a1d00;
  --good:#1d8a52; --warn:#c07a0c; --bad:#c23a32; --info:#2f6fb5;
  --d1:#1d8a52; --d2:#67b37d; --d3:#c9cfc3; --d4:#e48b6b; --d5:#c23a32; --d-fg-dark:#0e1510; --d-fg-light:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1410; --surface:#141d17; --sunk:#1b261f; --line:#2a372f; --fg:#e6ede7; --muted:#93a198;
  --turf:#17402b; --turf-2:#1d5236; --chalk:rgba(255,255,255,.28); --armband:#f0b23a; --armband-fg:#241800;
  --good:#3fbf7a; --warn:#e8a33a; --bad:#ef6a5f; --info:#6ea6e6;
  --d1:#2f9e62; --d2:#5d9c70; --d3:#46524a; --d4:#b76a50; --d5:#b5372f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1410; --surface:#141d17; --sunk:#1b261f; --line:#2a372f; --fg:#e6ede7; --muted:#93a198;
  --turf:#17402b; --turf-2:#1d5236; --chalk:rgba(255,255,255,.28); --armband:#f0b23a; --armband-fg:#241800;
  --good:#3fbf7a; --warn:#e8a33a; --bad:#ef6a5f; --info:#6ea6e6;
  --d1:#2f9e62; --d2:#5d9c70; --d3:#46524a; --d4:#b76a50; --d5:#b5372f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.lbl{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--armband);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px 8px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:28px;font-weight:800;line-height:1}
.brand .sub{font-size:13px;color:var(--muted)}
.score{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.score div{display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.deadline b{color:var(--armband)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--turf-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);padding-block:6px 0}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--turf-2)}
.btn.primary{background:var(--turf-2);border-color:var(--turf-2);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}

main{padding-block:20px 60px}
@media (max-width:600px){header{position:static}.brand h1{font-size:24px}.score{gap:12px;margin-left:0}.score b{font-size:18px}}
section.view{display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}

/* pitch */
.pitchwrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pitch{grid-template-columns:minmax(0,1fr);position:relative;background:repeating-linear-gradient(180deg,var(--turf) 0 56px,var(--turf-2) 56px 112px);padding:18px 8px 14px;display:grid;gap:14px}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid var(--chalk);border-radius:4px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:8px;width:150px;height:60px;transform:translateX(-50%);border:2px solid var(--chalk);border-top:0;pointer-events:none}
.row{min-width:0;position:relative;display:flex;justify-content:center;gap:6px;z-index:1;flex-wrap:nowrap}
.bench{background:var(--sunk);padding:12px 8px;display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
.bench .lbl{align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px}
.pc{position:relative;width:96px;flex:0 1 96px;min-width:0;background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 5px 5px;text-align:center;border:0;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.pc .tm{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.pc .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .xp{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.pc .fx{display:flex;gap:2px;justify-content:center;margin-top:3px}
.pc .fx span{flex:1;min-width:0;font-size:9.5px;font-weight:600;border-radius:3px;padding:1px 0;font-family:var(--display);letter-spacing:.02em}
.badge{position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--armband);color:var(--armband-fg);font-family:var(--display);font-weight:800;font-size:13px;line-height:20px}
.badge.v{background:var(--fg);color:var(--surface)}
.flag{position:absolute;top:-6px;left:-4px;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:700;line-height:18px;padding:0 4px;color:#fff}
.flag.d{background:var(--warn)} .flag.i,.flag.s,.flag.u,.flag.n{background:var(--bad)}
@media (max-width:520px){.pc{flex-basis:70px;padding:5px 3px 4px}.pc .nm{font-size:11.5px}.pc .xp{font-size:16px}.pc .fx span{font-size:8.5px}.row,.bench{gap:4px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* difficulty chips */
.d1{background:var(--d1);color:var(--d-fg-light)} .d2{background:var(--d2);color:var(--d-fg-dark)} .d3{background:var(--d3);color:var(--fg)} .d4{background:var(--d4);color:var(--d-fg-dark)} .d5{background:var(--d5);color:var(--d-fg-light)}

/* lists */
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:14px}
.alerts li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--info)}
.alerts li.bad::before{background:var(--bad)} .alerts li.warn::before{background:var(--warn)} .alerts li.good::before{background:var(--good)}

.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx .step{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted);width:28px}
.tx .mv{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.tx .mv .out{color:var(--bad)} .tx .mv .in{color:var(--good)}
.tx .why{grid-column:2/4;font-size:13px;color:var(--muted)}
.tx .gain{text-align:right;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mut{color:var(--muted)}
.verdict{border-left:4px solid var(--turf-2);background:var(--sunk);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:15px}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort[aria-sort]{color:var(--fg)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--armband)}
.pname{font-weight:600}
.tick td.fxc{padding:3px}
.fxc span{display:block;text-align:center;border-radius:4px;padding:4px 2px;font-family:var(--display);font-weight:600;font-size:13px;min-width:58px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px}
.filters input[type=search]{flex:1 1 180px;min-width:0}

.capbars{display:grid;gap:10px}
.cb{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 48px;gap:10px;align-items:center}
.cb .track{height:22px;background:var(--sunk);border-radius:4px;overflow:hidden}
.cb .fill{height:100%;background:var(--turf-2);border-radius:4px}
.cb.top .fill{background:var(--armband)}
.cb .val{font-family:var(--display);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.cb .why{grid-column:1/4;font-size:12.5px;color:var(--muted);margin-top:-6px}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.chip{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.chip h3{font-size:18px}
.chip.used{opacity:.6}

.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cmp{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cmp dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 0;font-size:13px}
.cmp dt{color:var(--muted)} .cmp dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmp dd.best{color:var(--good)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;display:grid;gap:14px;overflow:auto}
.dlg .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;color:var(--muted)}
.brk{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.brk div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.brk b{display:block;font-family:var(--display);font-size:18px}
.gwbars{display:flex;gap:6px;align-items:flex-end;height:90px}
.gwbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);justify-content:flex-end;height:100%}
.gwbars i{display:block;width:100%;background:var(--turf-2);border-radius:3px 3px 0 0}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart text{font-size:14px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---- v2 additions ---- */
.steps{display:grid;gap:14px}
.stepcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stepcard .sbody{display:grid;gap:6px;min-width:0}
.stepcard .no{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;background:var(--sunk);color:var(--muted)}
.stepcard.act .no{background:var(--armband);color:var(--armband-fg)}
.stepcard.ok .no{background:var(--good);color:#fff}
.stepcard h3{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stepcard .do{font-size:16px;font-weight:600}
.stepcard .sub{font-size:13.5px;color:var(--muted)}
.moves{display:grid;gap:6px;margin:6px 0 2px}
.move{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.move .out{color:var(--bad)} .move .in{color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left}
.opt b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--armband);box-shadow:inset 0 0 0 1px var(--armband)}
.opt span{font-size:12px;color:var(--muted)}
.gwsel{display:flex;gap:6px;flex-wrap:wrap}
.gwsel button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:15px;min-width:64px;text-align:left}
.gwsel button small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.gwsel button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.gwsel button[aria-pressed="true"] small{color:var(--surface);opacity:.8}
.pc.sel{outline:3px solid var(--armband);outline-offset:1px}
.pc.newin{box-shadow:inset 0 -3px 0 var(--good)}
.plansum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.cand:hover{background:var(--sunk)}
.cand .d{font-size:12px;color:var(--muted);grid-column:1/4}
.cand b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.s1{stroke:var(--turf-2);background:var(--turf-2)} .s2{stroke:var(--armband);background:var(--armband)} .s3{stroke:var(--info);background:var(--info)} .s4{stroke:var(--bad);background:var(--bad)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.minibar{display:inline-block;height:8px;border-radius:4px;background:var(--turf-2);vertical-align:middle}
.minibar.neg{background:var(--bad)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
footer{padding-block:0 40px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand"><h1 id="teamName">FPL Lab</h1><span class="sub" id="mgr">Loading your squad…</span></div>
      <div class="score" id="score"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="week">This week</button>
      <button role="tab" data-v="planner">Planner</button>
      <button role="tab" data-v="rivals">Rivals</button>
      <button role="tab" data-v="fixtures">Fixtures</button>
      <button role="tab" data-v="players">Players</button>
      <button role="tab" data-v="stats">Stats</button>
      <button role="tab" data-v="chips">Chips</button>
      <button role="tab" data-v="season">Season</button>
      <button role="tab" data-v="model">Model</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="meta" id="meta"></div>
  <div id="app" style="margin-top:14px"><p class="empty">Loading the latest FPL data…</p></div>
</main>
<footer class="wrap">FPL Lab uses the public Fantasy Premier League API. Projections are estimates, not guarantees.</footer>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
const REPO = "AFG-design/FPL-Lab";
const S = { view: "week", plan: null, fxMode: "att", sort: "xp5", dir: -1, pos: "ALL", team: "ALL", maxp: "", q: "", cmp: [],
  stSort: "xgi90_4", stPos: "ATT", trendTeam: null, pitch: "plan" };
let D, P, T, GWS, PG, MINE, SB;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = x => (Math.round((x || 0) * 10) / 10).toFixed(1);
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + f1(Math.abs(x));
const money = x => "£" + Number(x).toFixed(1) + "m";
const rankFmt = n => n == null ? "–" : n.toLocaleString("en-GB");
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const VIEWS = ["week", "planner", "rivals", "fixtures", "players", "stats", "chips", "season", "model"];
{ const v = store.get("fpl.view"); if (VIEWS.includes(v)) S.view = v; }
if (location.hash && VIEWS.includes(location.hash.slice(1))) S.view = location.hash.slice(1);

/* ---------- helpers ---------- */
function attClass(x) { return x >= 1.9 ? "d1" : x >= 1.5 ? "d2" : x >= 1.15 ? "d3" : x >= 0.85 ? "d4" : "d5"; }
function defClass(x) { return x <= 0.85 ? "d1" : x <= 1.1 ? "d2" : x <= 1.4 ? "d3" : x <= 1.75 ? "d4" : "d5"; }
const fxFor = (tid, g) => T[tid].fx[g] || [];
const oppTxt = x => x.home ? T[x.opp].short : T[x.opp].short.toLowerCase();
function fxChips(p, from, n = 3) {
  const gs = GWS.filter(g => g >= from).slice(0, n);
  return gs.map(g => {
    const fx = fxFor(p.team, g);
    if (!fx.length) return `<span class="d5">—</span>`;
    return fx.map(x => `<span class="${(p.pos === "GKP" || p.pos === "DEF") ? defClass(x.xga) : attClass(x.xgf)}" title="GW${g}: ${T[x.opp].name} ${x.home ? "home" : "away"}">${oppTxt(x)}</span>`).join("");
  }).join("");
}
const fxText = (p, g) => fxFor(p.team, g).map(x => `${T[x.opp].short} (${x.home ? "H" : "A"})`).join(" + ") || "Blank";
function flag(p) {
  if (p.status === "a") return "";
  return `<span class="flag ${p.status}" title="${esc(p.news)}">${p.chance != null ? p.chance + "%" : "!"}</span>`;
}
const xpg = (id, g) => (P[id]?.xp[g]) || 0;
const xpFrom = (id, g, n = 99) => GWS.filter(x => x >= g).slice(0, n).reduce((a, x) => a + xpg(id, x), 0);

function bestXI(ids, g) {
  const ps = ids.filter(i => P[i]).slice().sort((a, b) => xpg(b, g) - xpg(a, g));
  const by = { GKP: [], DEF: [], MID: [], FWD: [] };
  ps.forEach(i => by[P[i].pos].push(i));
  const xi = [...by.GKP.slice(0, 1), ...by.DEF.slice(0, 3), ...by.MID.slice(0, 2), ...by.FWD.slice(0, 1)];
  const cap = { DEF: 5, MID: 5, FWD: 3 };
  for (const i of ps) {
    if (xi.length === 11) break;
    if (xi.includes(i) || P[i].pos === "GKP") continue;
    if (xi.filter(j => P[j].pos === P[i].pos).length < cap[P[i].pos]) xi.push(i);
  }
  const bench = [...by.GKP.filter(i => !xi.includes(i)), ...ps.filter(i => !xi.includes(i) && P[i].pos !== "GKP")];
  const order = xi.slice().sort((a, b) => xpg(b, g) - xpg(a, g));
  const pts = xi.reduce((a, i) => a + xpg(i, g), 0) + (order[0] ? xpg(order[0], g) : 0);
  return { xi, bench, cap: order[0], vice: order[1], pts };
}

/* ---------- load ---------- */
async function fetchData() {
  const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  return r.json();
}
function ingest(d) {
  D = d; P = {}; D.players.forEach(p => P[p.id] = p);
  T = D.teams; GWS = D.meta.proj_gws; PG = D.meta.plan_gws || GWS.slice(0, 5);
  MINE = new Set(D.squad.map(s => s.id));
  if (!S.trendTeam) S.trendTeam = P[D.squad[0]?.id]?.team || 1;
  loadSandbox();
}
async function load() {
  try { ingest(await fetchData()); } catch (e) {
    $("#app").innerHTML = `<p class="empty">The data file could not be loaded. Reload the page to try again.</p>`; return;
  }
  header(); render();
}
setInterval(async () => {
  try { const nd = await fetchData(); if (D && nd.meta.built !== D.meta.built) { ingest(nd); header(); render(); } } catch (e) {}
}, 5 * 60 * 1000);

function countdown(iso) {
  if (!iso) return "–";
  const ms = new Date(iso) - new Date();
  if (ms <= 0) return "Passed";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d ? `${d}d ${h}h` : `${h}h ${m}m`;
}
const ukTime = iso => new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });

/* ---------- pitch ---------- */
function card(id, g, o = {}) {
  const p = P[id]; if (!p) return "";
  const badge = o.cap === id ? `<span class="badge">C</span>` : o.vice === id ? `<span class="badge v">V</span>` : "";
  const cls = ["pc", o.sel === id ? "sel" : "", o.fresh?.has(id) ? "newin" : ""].join(" ");
  return `<button class="${cls}" data-${o.act || "p"}="${id}" aria-label="${esc(p.name)}">${flag(p)}${badge}
    <div class="tm">${T[p.team].short} ${p.price.toFixed(1)}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="xp">${f1(xpg(id, g))}</div>
    <div class="fx">${fxChips(p, g, 3)}</div></button>`;
}
function pitch(xi, bench, g, o = {}) {
  const rows = ["GKP", "DEF", "MID", "FWD"].map(pos => `<div class="row">${xi.filter(i => P[i]?.pos === pos).map(i => card(i, g, o)).join("")}</div>`).join("");
  return `<div class="pitchwrap"><div class="pitch">${rows}</div><div class="bench"><span class="lbl">Bench</span>${bench.map(i => card(i, g, o)).join("")}</div></div>`;
}

/* ---------- plans ---------- */
const PLAN_LABEL = { roll: "Roll", one: "1 move", two: "2 moves", three: "3 moves", best: "Optimal" };
function planMoves(pl) {
  // pair outs and ins by position for each week
  const mv = [];
  pl.weeks.forEach(w => {
    const outs = w.out.slice(), ins = w.in.slice();
    ins.forEach(i => {
      const k = outs.findIndex(o => P[o]?.pos === P[i]?.pos);
      if (k >= 0) mv.push({ gw: w.gw, out: outs.splice(k, 1)[0], in: i });
    });
  });
  return mv;
}
function recommendedPlan() {
  const pl = D.plans || {};
  const keys = ["roll", "one", "two", "three"].filter(k => pl[k]);
  if (!keys.length) return null;
  const best = keys.reduce((a, k) => pl[k].vs_roll > pl[a].vs_roll ? k : a, keys[0]);
  // prefer fewer moves when within 0.5 pts: projections are noisy and flexibility has value
  for (const k of keys) if (pl[k].vs_roll >= pl[best].vs_roll - 0.5) return k;
  return best;
}

/* ---------- This week ---------- */
function vWeek() {
  const g = D.meta.next_gw, pl = D.plans || {};
  const rec = recommendedPlan();
  const key = S.plan && pl[S.plan] ? S.plan : rec;
  const plan = pl[key];
  if (!plan) return `<div class="panel"><p>No plan is available for this gameweek yet.</p></div>`;
  const w0 = Object.assign({}, plan.weeks[0]);
  // armband: prefer the best attacker when a GKP/DEF only edges it (attackers have the higher ceiling)
  { const att = w0.xi.filter(i => ["MID", "FWD"].includes(P[i].pos)).sort((a, b) => xpg(b, g) - xpg(a, g))[0];
    const c = w0.captain;
    w0.capSwap = null;
    if (att && att !== c && ["GKP", "DEF"].includes(P[c].pos) && xpg(c, g) - xpg(att, g) < 0.6) { w0.capSwap = c; w0.vice = c; w0.captain = att; } }
  const moves0 = planMoves(plan).filter(m => m.gw === g);
  const later = planMoves(plan).filter(m => m.gw !== g);
  const ft = D.manager.free_transfers;

  // step 1 transfers
  const opts = ["roll", "one", "two", "three", "best"].filter(k => pl[k]).map(k => {
    const n = pl[k].weeks[0].in.length;
    return `<button class="opt ${k === key ? "sel" : ""}" data-plan="${k}"><span>${PLAN_LABEL[k]}${k === "best" ? ` (${n})` : ""}${k === rec ? " · pick" : ""}</span><b class="${pl[k].vs_roll > 0.05 ? "up" : ""}">${sgn(pl[k].vs_roll)}</b><span>vs rolling, 5 GWs</span></button>`;
  }).join("");
  const mvHTML = moves0.length ? `<div class="moves">${moves0.map(m => `<div class="move"><span class="out">▼ ${esc(P[m.out].name)}</span><span class="muted mono">${money(sellPrice(m.out))}</span><span class="in">▲ ${esc(P[m.in].name)}</span><span class="muted mono">${money(P[m.in].price)} · ${T[P[m.in].team].short}</span><span class="tag">${sgn(xpFrom(m.in, g, 5) - xpFrom(m.out, g, 5))} over 5 GWs</span></div>`).join("")}</div>` : "";
  const t1 = moves0.length
    ? `Make ${moves0.length} transfer${moves0.length > 1 ? "s" : ""}${w0.hits ? ` (${w0.hits} hit${w0.hits > 1 ? "s" : ""})` : ""}`
    : `Roll your transfer${ft > 1 ? "s" : ""}`;
  const t1sub = moves0.length
    ? `Uses ${Math.min(moves0.length, ft)} of ${ft} free transfers. Bank after: ${money(w0.bank)}.${later.length ? ` The plan then makes ${later.length} more move${later.length > 1 ? "s" : ""} in later weeks.` : ""}`
    : `You'll have ${Math.min(5, ft + 1)} free transfers next week. No move beats rolling by enough.`;
  const close = Math.abs((pl.roll?.objective || 0) - (plan.objective || 0)) < 1;

  // step 2 lineup
  const curXI = new Set(D.lineup.current_xi || []);
  const newXI = new Set(w0.xi);
  const starts = w0.xi.filter(i => !curXI.has(i));
  const benches = [...curXI].filter(i => !newXI.has(i) && w0.bench.includes(i));
  const lineupTxt = starts.length || benches.length
    ? `${starts.length ? `Start <b>${starts.map(i => esc(P[i].name)).join(", ")}</b>` : ""}${starts.length && benches.length ? "; " : ""}${benches.length ? `bench <b>${benches.map(i => esc(P[i].name)).join(", ")}</b>` : ""}.`
    : "Same starting XI as last week.";

  // step 3 captain
  const capOpts = w0.xi.slice().sort((a, b) => xpg(b, g) - xpg(a, g)).slice(0, 5);
  const cmax = xpg(capOpts[0], g) || 1;
  const capGap = xpg(w0.captain, g) - xpg(w0.vice, g);
  const capPos = P[w0.captain].pos;
  const capNote = w0.capSwap
    ? `${esc(P[w0.capSwap].name)} projects ${f1(xpg(w0.capSwap, g) - xpg(w0.captain, g))} more on clean-sheet odds, but that's too small a gap to give up ${esc(P[w0.captain].name)}'s much higher ceiling.`
    : capGap >= 0 ? `${f1(capGap)} pts ahead of the vice-captain.` : `Chosen for ceiling over ${esc(P[w0.vice].name)}, who projects slightly more.`;

  // step 4 chips
  const tc = D.chips.find(c => c.key === "3xc" && c.available && c.to <= 19);
  const bestTc = (D.gw_info || []).reduce((a, r) => (!a || r.tc_xp > a.tc_xp) ? r : a, null);
  const chipTxt = tc && bestTc && bestTc.gw === g ? `Consider Triple Captain this week: GW${g} is your best projected armband week in the next ${GWS.length}.`
    : "No chip this week.";
  const chipSub = tc ? `Triple Captain (first half) is unused and expires after GW${tc.to}.${bestTc ? ` Best spot in view: GW${bestTc.gw} (${esc(P[bestTc.tc_player]?.name)}).` : ""}` : "Your other first-half chips are used. The second set unlocks in GW20.";

  // step 5 risks
  const risks = [];
  const finalSquad = squadAfter(moves0);
  finalSquad.forEach(i => {
    const p = P[i]; if (!p) return;
    if (p.status !== "a") risks.push(["bad", `<b>${esc(p.name)}</b>: ${esc(p.news || "flagged")}`]);
    const pr = p.price_proj?.[0];
    if (pr != null && pr <= -80) risks.push(["warn", `<b>${esc(p.name)}</b> may drop in price tonight (${pr.toFixed(0)}% of the way).`]);
    if (newXI.has(i) && p.xmin < 50 && p.status === "a") risks.push(["warn", `<b>${esc(p.name)}</b> is starting but only projected ~${p.xmin} minutes.`]);
  });
  threats(2).forEach(r => risks.push(["warn", `<b>${esc(P[r.id].name)}</b> is in ${r.own.toFixed(0)}% of top-10k teams (EO ${Math.round(r.eo * 100)}%) and not in yours. If he hauls, you lose ground (${sgn(r.impact)} projected).`]));
  moves0.forEach(m => { const pr = P[m.in].price_proj?.[0]; if (pr != null && pr >= 80) risks.push(["good", `<b>${esc(P[m.in].name)}</b> may rise tonight. Buy before the next price update.`]); });

  const step = (n, state, title, body) => `<div class="stepcard ${state}"><span class="no">${state === "ok" ? "✓" : n}</span><div class="sbody"><h3>${title}</h3>${body}</div></div>`;
  return `
  <div class="grid2">
    <div class="steps">
      <div class="bar" style="margin:0"><h2>Before the GW${g} deadline</h2><span class="muted">${countdown(D.meta.deadline)} left</span></div>
      ${step(1, moves0.length ? "act" : "ok", "Transfers", `<div class="do">${t1}</div>${mvHTML}<div class="sub">${t1sub}${close && moves0.length ? " The options are close, so treat this as a nudge rather than a must." : ""}</div>
        <div class="opts">${opts}</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-loadplan="${key}">Open in planner</button></div>`)}
      ${step(2, starts.length || benches.length ? "act" : "ok", "Lineup", `<div class="do">${lineupTxt}</div><div class="sub">Best XI projects <b>${f1(w0.xp)}</b> pts including the captain. Bench order: ${w0.bench.map(i => esc(P[i].name)).join(", ")}.</div>`)}
      ${step(3, "act", "Captain", `<div class="do">C ${esc(P[w0.captain].name)} · V ${esc(P[w0.vice].name)}</div><div class="sub">${capNote}</div>
        <div class="capbars" style="margin-top:8px">${capOpts.map((i, k) => `<div class="cb ${i === w0.captain ? "top" : ""}"><span class="pname">${esc(P[i].name)}<br><span class="muted" style="font-weight:400;font-size:12.5px">${fxText(P[i], g)}</span></span><div class="track"><div class="fill" style="width:${xpg(i, g) / cmax * 100}%"></div></div><span class="val">${f1(xpg(i, g))}</span></div>`).join("")}</div>`)}
      ${step(4, "ok", "Chip", `<div class="do">${chipTxt}</div><div class="sub">${chipSub}</div>`)}
      ${step(5, risks.some(r => r[0] !== "good") ? "act" : "ok", "Risks to check", risks.length ? `<ul class="alerts" style="margin-top:4px">${risks.map(([c, t]) => `<li class="${c}"><span>${t}</span></li>`).join("")}</ul>` : `<div class="sub">No injury flags or price drops in your squad.</div>`)}
    </div>
    <div style="min-width:0;display:grid;gap:10px;align-content:start">
      <div class="bar" style="margin:0"><h3>GW${g} team · ${PLAN_LABEL[key]}</h3><span class="tag">${f1(w0.xp)} xP</span></div>
      ${pitch(w0.xi, w0.bench, g, { cap: w0.captain, vice: w0.vice, fresh: new Set(moves0.map(m => m.in)) })}
      <p class="note">Big number = projected points this gameweek. Chips show the next 3 opponents (capitals = home), coloured by difficulty for that player's role. A green underline marks a new signing. Tap any player for detail.</p>
    </div>
  </div>`;
}
function squadAfter(moves) {
  const s = D.squad.map(x => x.id);
  moves.forEach(m => { const k = s.indexOf(m.out); if (k >= 0) s[k] = m.in; });
  return s;
}
function sellPrice(id) { const s = D.squad.find(x => x.id === id); return s ? s.sell : P[id].price; }

/* ---------- Planner (sandbox) ---------- */
function sbKey() { return `fpl.sb.${D.meta.team_id}.${D.meta.next_gw}.${D.squad.map(s => s.id).join("-")}`; }
function loadSandbox() {
  const saved = store.get(sbKey());
  SB = { moves: [], gw: PG[0], sel: null, q: "" };
  if (saved && Array.isArray(saved.moves)) SB.moves = saved.moves.filter(m => P[m.in] && P[m.out] && PG.includes(m.gw));
  sanitize();
}
function saveSandbox() { store.set(sbKey(), { moves: SB.moves }); }
function squadAt(gw) {
  const s = D.squad.map(x => x.id);
  SB.moves.filter(m => m.gw <= gw).forEach(m => { const k = s.indexOf(m.out); if (k >= 0) s[k] = m.in; });
  return s;
}
function bankAt(gw) {
  let b = D.manager.bank;
  const base = new Set(D.squad.map(x => x.id)), boughtLater = new Set();
  SB.moves.filter(m => m.gw <= gw).forEach(m => {
    b += (base.has(m.out) && !boughtLater.has(m.out)) ? sellPrice(m.out) : P[m.out].price;
    b -= P[m.in].price; boughtLater.add(m.in);
  });
  return Math.round(b * 10) / 10;
}
function sanitize() {
  // drop moves that no longer make sense (player sold earlier, duplicates)
  const ok = [];
  SB.moves.sort((a, b) => a.gw - b.gw);
  for (const m of SB.moves) {
    const prev = SB.moves.slice(0, ok.length);
    const s = D.squad.map(x => x.id);
    ok.forEach(q => { const k = s.indexOf(q.out); if (k >= 0) s[k] = q.in; });
    if (s.includes(m.out) && !s.includes(m.in)) ok.push(m);
  }
  SB.moves = ok;
}
function ftTable() {
  let ft = Math.min(5, D.manager.free_transfers);
  return PG.map(g => {
    const n = SB.moves.filter(m => m.gw === g).length;
    const hits = Math.max(0, n - ft);
    const row = { gw: g, ft, n, hits };
    ft = n > ft ? 1 : Math.min(5, ft - n + 1);
    row.next = ft;
    return row;
  });
}
function clubCounts(ids) { const c = {}; ids.forEach(i => c[P[i].team] = (c[P[i].team] || 0) + 1); return c; }
function sandboxSummary() {
  const fts = ftTable();
  const base = D.squad.map(x => x.id);
  let tot = 0, baseTot = 0;
  const weeks = fts.map((r, k) => {
    const sq = squadAt(r.gw), t = bestXI(sq, r.gw), b = bestXI(base, r.gw);
    tot += t.pts - 4 * r.hits; baseTot += b.pts;
    const cc = clubCounts(sq), over = Object.entries(cc).filter(([, v]) => v > 3).map(([t]) => T[t].short);
    return { ...r, team: t, base: b.pts, bank: bankAt(r.gw), over };
  });
  return { weeks, tot, baseTot };
}
function vPlanner() {
  const sum = sandboxSummary();
  const g = SB.gw, wk = sum.weeks.find(w => w.gw === g);
  const sq = squadAt(g), t = wk.team;
  const fresh = new Set(SB.moves.filter(m => m.gw <= g).map(m => m.in));
  const problems = sum.weeks.filter(w => w.bank < 0 || w.over.length);
  const gwButtons = sum.weeks.map(w => `<button data-sbgw="${w.gw}" aria-pressed="${w.gw === g}">GW${w.gw}<small>${w.n} move${w.n === 1 ? "" : "s"}${w.hits ? ` · −${4 * w.hits}` : ""} · ${f1(w.team.pts)}</small></button>`).join("");
  const movesList = SB.moves.length ? SB.moves.map((m, k) => `<div class="move" style="justify-content:space-between"><span><span class="tag">GW${m.gw}</span> <span class="out">▼ ${esc(P[m.out].name)}</span> <span class="in">▲ ${esc(P[m.in].name)}</span> <span class="muted mono">${sgn(xpFrom(m.in, m.gw, PG.length) - xpFrom(m.out, m.gw, PG.length))}</span></span><button class="btn" data-undo="${k}" aria-label="Remove move">Remove</button></div>`).join("") : `<p class="muted" style="margin:0">No moves yet. Tap a player on the pitch to replace them, or load a plan below.</p>`;
  const delta = sum.tot - sum.baseTot;
  const plans = Object.keys(D.plans || {}).map(k => `<button class="btn" data-loadplan="${k}">${PLAN_LABEL[k]} (${sgn(D.plans[k].vs_roll)})</button>`).join(" ");
  return `
  <div class="plansum">
    <div class="kpi"><span class="lbl">Your plan · ${PG.length} GWs</span><b>${f1(sum.tot)}</b><span class="delta muted">best XI + captain, minus hits</span></div>

/* ---------- Rivals: the field and mini-leagues ---------- */
function recTeam() {
  const g = D.meta.next_gw, pl = D.plans || {}, key = S.plan && pl[S.plan] ? S.plan : recommendedPlan();
  if (!key) return null;
  const w = Object.assign({}, pl[key].weeks[0]);
  const att = w.xi.filter(i => ["MID", "FWD"].includes(P[i]?.pos)).sort((a, b) => xpg(b, g) - xpg(a, g))[0];
  if (att && att !== w.captain && ["GKP", "DEF"].includes(P[w.captain]?.pos) && xpg(w.captain, g) - xpg(att, g) < 0.6) { w.vice = w.captain; w.captain = att; }
  const mult = {}; w.xi.forEach(i => mult[i] = 1); mult[w.captain] = 2;
  return { ...w, key, mult };
}
const field = () => D.crowd ? D.crowd[S.field === "near" ? "near" : "top10k"] : null;
function fieldRows(F, mult, g) {
  const ids = new Set([...Object.keys(F.eo).map(Number), ...Object.keys(mult).map(Number)]);
  return [...ids].filter(i => P[i]).map(i => {
    const eo = (F.eo[i] || 0) / 100, mine = mult[i] || 0, x = xpg(i, g);
    return { id: i, eo, own: F.own[i] || 0, cap: F.cap[i] || 0, mine, x, impact: (mine - eo) * x };
  });
}
function threats(n = 3) {
  const F = D.crowd?.top10k, t = recTeam(); if (!F || !t) return [];
  return fieldRows(F, t.mult, D.meta.next_gw).filter(r => r.impact < -1 && r.mine === 0).sort((a, b) => a.impact - b.impact).slice(0, n);
}

  const label = S.field === "near" ? `managers around your rank (${rankFmt(F.rank_from)}–${rankFmt(F.rank_to)})` : "the top 10,000";

  if (!S.cmp.length) return "";
  const ps = S.cmp.map(i => P[i]).filter(Boolean);
  const stats = [["Price", p => p.price, -1, money], ["xP next", p => p.xp1, 1, f1], ["xP next 5", p => p.xp5, 1, f1], ["xGI/90 L4", p => p.xgi90_4, 1, x => x.toFixed(2)], ["xGI/90 model", p => p.xgi90, 1, x => x.toFixed(2)], ["xMins", p => p.xmin, 1, x => x], ["Points", p => p.pts, 1, x => x], ["Goals − xG", p => p.g_xg, 0, x => (x > 0 ? "+" : "") + x.toFixed(1)], ["Owned", p => p.own, 0, x => x.toFixed(1) + "%"], ["DC chance", p => p.dc_rate * 100, 1, x => x.toFixed(0) + "%"]];
  return `<div class="compare" style="margin-bottom:12px">${ps.map(p => `<div class="cmp"><div class="bar" style="margin:0"><b>${esc(p.name)}</b><button class="btn" data-uncmp="${p.id}" aria-label="Remove">✕</button></div>
    <span class="muted">${T[p.team].short} · ${p.pos}</span>
    <dl>${stats.map(([l, fn, dir, fmt]) => { const vals = ps.map(fn), best = dir === 1 ? Math.max(...vals) : dir === -1 ? Math.min(...vals) : null, v = fn(p); return `<dt>${l}</dt><dd class="${ps.length > 1 && best === v ? "best" : ""}">${fmt(v)}</dd>`; }).join("")}</dl></div>`).join("")}</div>`;
}

/* ---------- Stats ---------- */
function lineChart(series, labels, { h = 200, yfmt = x => x, title = "" } = {}) {
  const W = 600, pad = { l: 40, r: 12, t: 12, b: 26 };
  const all = series.flatMap(s => s.vals.filter(v => v != null));
  const mx = Math.max(1, ...all), mn = Math.min(0, ...all);
  const nice = mx <= 2 ? 0.5 : mx <= 5 ? 1 : mx <= 12 ? 2 : 5;
  const top = Math.ceil(mx / nice) * nice;
  const x = i => pad.l + (labels.length === 1 ? 0 : i / (labels.length - 1)) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - mn) / (top - mn)) * (h - pad.t - pad.b);
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += nice) ticks.push(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}">
    ${ticks.map(v => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${yfmt(v)}</text>`).join("")}
    ${labels.map((l, i) => `<text x="${x(i)}" y="${h - 8}" text-anchor="middle">${l}</text>`).join("")}
    ${series.map(s => `<polyline class="${s.cls}" fill="none" stroke-width="2.5" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""} points="${s.vals.map((v, i) => `${x(i)},${y(v || 0)}`).join(" ")}"/>${s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v || 0)}" r="3" class="${s.cls}" fill="var(--surface)" stroke-width="2"/>`).join("")}`).join("")}
  </svg>`;
}

/* ---------- Season ---------- */
function rankChart(h) {
  const W = 640, H = 220, pad = { l: 64, r: 16, t: 14, b: 28 };
  const ranks = h.map(x => x.rank), lo = Math.log10(Math.min(...ranks)), hi = Math.log10(Math.max(...ranks)), span = Math.max(0.3, hi - lo);
  const y = r => pad.t + (Math.log10(r) - (lo - 0.05)) / (span + 0.1) * (H - pad.t - pad.b);
  const x = i => pad.l + (h.length === 1 ? 0 : i / (h.length - 1)) * (W - pad.l - pad.r);
  const ticks = [];
  for (let e = Math.floor(lo); e <= Math.ceil(hi); e++) [1, 2, 5].forEach(m => { const v = m * 10 ** e; if (Math.log10(v) >= lo - 0.05 && Math.log10(v) <= hi + 0.05) ticks.push(v); });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall rank by gameweek">
    ${ticks.map(t => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1e6 ? t / 1e6 + "m" : t >= 1e3 ? t / 1e3 + "k" : t}</text>`).join("")}
    <polyline points="${h.map((d, i) => `${x(i)},${y(d.rank)}`).join(" ")}" fill="none" class="s1" stroke-width="2.5"/>
    ${h.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.rank)}" r="${i === h.length - 1 ? 5 : 3}" fill="${i === h.length - 1 ? "var(--armband)" : "var(--turf-2)"}"/><text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.gw}</text>`).join("")}</svg>`;
}
function vSeason() {
  const h = D.history, L = D.live, mx = Math.max(...h.map(x => x.pts));
  const live = L ? `<div class="panel"><div class="bar"><h3>GW${L.gw} ${L.finished ? "result" : "live points"}</h3><span class="muted">${L.points} pts · average ${L.average ?? "–"} · highest ${L.highest ?? "–"}</span></div>
    <div class="tablebox"><table><thead><tr><th>Player</th><th class="n">Mins</th><th class="n">BPS</th><th class="n">Bonus</th><th class="n">Pts</th><th class="n">Counted</th></tr></thead><tbody>${L.rows.map(r => `<tr><td><span class="pname">${esc(P[r.id]?.name || r.id)}</span>${r.cap ? ' <span class="pill warn">C</span>' : r.vice ? ' <span class="pill mut">V</span>' : ""}${r.pos > 11 ? ' <span class="muted">bench</span>' : ""}</td><td class="n">${r.mins}</td><td class="n">${r.bps}</td><td class="n">${r.bonus}</td><td class="n">${r.pts}</td><td class="n"><b>${r.pts * r.mult}</b></td></tr>`).join("")}</tbody></table></div>

  return `<div class="grid2"><div class="panel"><h3>Overall rank</h3>${rankChart(h)}</div>
    <div class="panel"><h3>Points per gameweek</h3><div class="gwbars">${h.map(x => `<div title="GW${x.gw}: ${x.pts} pts"><span class="num" style="color:var(--fg);font-weight:600">${x.pts}</span><i style="height:${x.pts / mx * 60}px;${x.chip ? "background:var(--armband)" : ""}"></i>${x.gw}</div>`).join("")}</div>
    <p class="note">Gold bars = chip weeks. Points left on your bench this season: <b>${h.reduce((a, x) => a + x.bench, 0)}</b>.</p></div></div>${live}`;
}

/* ---------- Model ---------- */
function vModel() {
  const A = D.accuracy;
  const acc = A ? `<div class="panel"><h2 style="margin-bottom:10px">How accurate is it?</h2>
    <p>Each finished gameweek (GW${A.gws[0]}–${A.gws[A.gws.length - 1]}) was projected again using only the data available before it, then compared with the real points of ${A.n.toLocaleString("en-GB")} player appearances.</p>
    <div class="kpis"><div class="kpi"><span class="lbl">Correlation with real points</span><b>${A.corr.toFixed(2)}</b><span class="delta muted">recent-points average: ${A.base_corr.toFixed(2)}</span></div>
      <div class="kpi"><span class="lbl">Typical miss (RMSE)</span><b>${A.rmse.toFixed(2)}</b><span class="delta muted">recent-points average: ${A.base_rmse.toFixed(2)}</span></div>
      <div class="kpi"><span class="lbl">Average miss</span><b>${A.mae.toFixed(2)}</b><span class="delta muted">points per player per GW</span></div></div>
    <h3 style="margin:16px 0 6px">Calibration</h3><p class="note" style="margin-top:0">When the model says a player will score about X, how many did players actually score on average?</p>
    <div class="tablebox"><table><thead><tr><th>Projected</th><th class="n">Players</th><th class="n">Avg projected</th><th class="n">Avg actual</th></tr></thead><tbody>${A.buckets.map(([b, c, px, pa]) => `<tr><td>${b}–${b + 1} pts</td><td class="n">${c}</td><td class="n">${px.toFixed(2)}</td><td class="n">${pa.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Single-gameweek FPL points are very noisy: a correlation around 0.4 is about as good as public models get. The value is in ranking players sensibly and avoiding bad bets, not in calling exact scores.</p></div>` : "";
  return `${acc}<div class="panel" style="max-width:800px"><h2 style="margin-bottom:10px">How the projections work</h2>
  <ul>
    <li><b>Team strength.</b> Attack and defence ratings from expected goals for and against in every match (70%) plus real goals (30%). They're adjusted for the opponents each team has faced and for home advantage, and pulled towards average while the sample is small.</li>
    <li><b>Fixtures.</b> Projected goals = league average (${D.meta.league_goals}) × attack × opponent defence × home/away. Clean-sheet and goals-conceded chances come from that, calibrated to real clean-sheet rates.</li>
    <li><b>Minutes.</b> How often a player starts or comes off the bench, and how long they play, over the last 5 gameweeks (recent games count more), times FPL's chance-of-playing flag.</li>
    <li><b>Player output.</b> xG and xA per 90 this season (recent games count more), blended with ${D.meta.priors_season || "last season"} and the two seasons before it, plus a positional average. First-choice penalty takers get a small boost. Assists are scaled up because FPL awards more assists than xA counts.</li>
    <li><b>Defensive contributions.</b> The chance of reaching the CBIT threshold, from each player's hit rate and their per-90 rate.</li>
    <li><b>Calibration.</b> The raw projections are adjusted so that, across past gameweeks, projected and real averages match (see the table above).</li>
    <li><b>Transfer plans.</b> An optimiser plans the next 5 gameweeks together: transfers, lineups and captains, within budget, squad shape, the 3-per-club rule and free-transfer rules. A banked free transfer is valued at 1.5 points.</li>
  </ul>
  <p class="note">Selling prices and free transfers are estimated from your public transfer history, because FPL only shows exact values when you're signed in. The model and data are updated every 30 minutes.</p></div>`;
}

    <div><span class="lbl">Projected points by gameweek</span><div class="gwbars" style="margin-top:6px">${GWS.map(x => `<div><span class="num" style="color:var(--fg);font-weight:600">${f1(xpg(id, x))}</span><i style="height:${xpg(id, x) / mx * 50}px"></i>${fxFor(p.team, x).map(oppTxt).join("+") || "–"}</div>`).join("")}</div></div>
    <div><span class="lbl">This season, by gameweek</span><div class="legend" style="margin-top:4px"><span><i class="s1"></i>Points</span><span><i class="s2"></i>xGI × 10</span></div>${lineChart([{ cls: "s1", vals: p.s_pts }, { cls: "s2", vals: p.s_xgi.map(v => v * 10) }], gwl, { h: 150 })}</div>
    <div class="brk"><div><span class="muted" style="font-size:12px">Season pts</span><b>${p.pts}</b></div><div><span class="muted" style="font-size:12px">G / A</span><b>${p.goals} / ${p.assists}</b></div><div><span class="muted" style="font-size:12px">xG / xA</span><b>${p.xg.toFixed(1)} / ${p.xa.toFixed(1)}</b></div><div><span class="muted" style="font-size:12px">xGI/90 L4</span><b>${p.xgi90_4.toFixed(2)}</b></div><div><span class="muted" style="font-size:12px">Starts</span><b>${Math.round(p.p_start * 100)}%</b></div>${p.last ? `<div><span class="muted" style="font-size:12px">${p.last.season} pts</span><b>${p.last.pts}</b></div>` : ""}${sq ? `<div><span class="muted" style="font-size:12px">Bought / sell</span><b>${sq.buy.toFixed(1)} / ${sq.sell.toFixed(1)}</b></div>` : ""}</div>
    ${MINE.has(id) ? `<button class="btn primary" data-plan-replace="${id}">Plan a replacement</button>` : ""}`;
  const dlg = $("#dlg"); dlg.showModal();
  $("#dlgX").onclick = () => dlg.close();
  const pr = $("[data-plan-replace]"); if (pr) pr.onclick = () => { dlg.close(); SB.sel = id; SB.gw = PG[0]; SB.q = ""; setView("planner"); };
}
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });

/* ---------- events ---------- */
function bind() {
  const on = (sel, fn, ev = "onclick") => document.querySelectorAll(sel).forEach(el => el[ev] = () => fn(el));
  on("[data-p]", b => openPlayer(+b.dataset.p));
  on("[data-fx]", b => { S.fxMode = b.dataset.fx; render(); });
  on("[data-field]", b => { S.field = b.dataset.field; render(); });
  on("[data-rival]", b => { S.rival = +b.dataset.rival || null; render(); if (S.rival && innerWidth < 900) document.querySelector(".grid2 > div:last-child")?.scrollIntoView({ behavior: "smooth" }); });
  const ls = $("#leagueSel"); if (ls) ls.onchange = e => { S.league = +e.target.value; S.rival = null; render(); };
  on("[data-plan]", b => { S.plan = b.dataset.plan; render(); });
  on("[data-loadplan]", b => { SB.moves = planMoves(D.plans[b.dataset.loadplan]); SB.sel = null; sanitize(); saveSandbox(); setView("planner"); });
  on("[data-sbgw]", b => { SB.gw = +b.dataset.sbgw; SB.sel = null; render(); });
  on("[data-sbp]", b => { const id = +b.dataset.sbp; SB.sel = SB.sel === id ? null : id; SB.q = ""; render(); if (SB.sel && innerWidth < 900) $("#candPanel")?.scrollIntoView({ behavior: "smooth" }); });
  on("[data-cancel]", () => { SB.sel = null; render(); });
  on("[data-pick]", b => {
    const g = SB.gw, out = SB.sel, inn = +b.dataset.pick;
    // a move from this GW replaces the player for all later weeks; drop later moves of the same player
    SB.moves = SB.moves.filter(m => !(m.gw >= g && m.out === out));
    SB.moves.push({ gw: g, out, in: inn }); SB.sel = null; sanitize(); saveSandbox(); render();
  });
  on("[data-undo]", b => { SB.moves.splice(+b.dataset.undo, 1); sanitize(); saveSandbox(); render(); });
  on("[data-reset]", () => { SB.moves = []; saveSandbox(); render(); });
  on("th[data-sort]", th => { const k = th.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = ["name", "team", "pos"].includes(k) ? 1 : -1; } render(); });
  on("[data-stsort]", th => { S.stSort = th.dataset.stsort; render(); });
  on("[data-stpos]", b => { S.stPos = b.dataset.stpos; render(); });
  on("[data-cmp]", c => { const id = +c.dataset.cmp; if (c.checked) { if (S.cmp.length >= 4) S.cmp.shift(); S.cmp.push(id); } else S.cmp = S.cmp.filter(x => x !== id); render(); }, "onchange");
  on("[data-uncmp]", b => { S.cmp = S.cmp.filter(x => x !== +b.dataset.uncmp); render(); });
  const tsel = $("#trendTeam"); if (tsel) tsel.onchange = e => { S.trendTeam = +e.target.value; render(); };
  const cq = $("#chartq");
  if (cq) cq.onchange = () => {
    const v = cq.value; const p = D.players.find(p => `${p.name} (${T[p.team].short})` === v);
    if (p && !S.cmp.includes(p.id)) { if (S.cmp.length >= 4) S.cmp.shift(); S.cmp.push(p.id); render(); }
  };
  const live = (id, key, obj) => {
    const el = $(id); if (!el) return;
    el.oninput = () => { obj[key] = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); };
  };
  live("#q", "q", S); live("#candq", "q", SB);
  const fp = $("#fpos"); if (fp) { fp.onchange = e => { S.pos = e.target.value; render(); }; $("#fteam").onchange = e => { S.team = e.target.value; render(); }; $("#fmax").onchange = e => { S.maxp = e.target.value; render(); }; }
}
setInterval(() => { const c = $("#cd"); if (c && D) c.textContent = countdown(D.meta.deadline); }, 30000);
load();

</script>
</body>
</html>
